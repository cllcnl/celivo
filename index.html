<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celivo</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --border: rgba(255,255,255,.08);
      --muted: #cbd5e1;
      --muted-2: #94a3b8;
      --shadow: 0 20px 50px rgba(0,0,0,.35);
      --primary: linear-gradient(90deg, #8b5cf6 0%, #38bdf8 100%);
      --danger: linear-gradient(90deg, #ef4444 0%, #f97316 100%);
      --success: linear-gradient(90deg, #10b981 0%, #06b6d4 100%);
      --bg-card: linear-gradient(180deg, rgba(12,20,40,.92), rgba(6,11,25,.98));
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,.18), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(168,85,247,.16), transparent 26%),
        radial-gradient(circle at 50% 80%, rgba(56,189,248,.12), transparent 34%),
        linear-gradient(180deg, #040816 0%, #020617 100%);
    }

    .topbar {
      padding: 12px 14px;
      display: grid;
      grid-template-columns: auto 1fr auto auto auto;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: rgba(2,6,23,.78);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .left-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .menu-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .brand {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -.04em;
      background: linear-gradient(90deg, #60a5fa, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .top-search-wrap {
      position: relative;
      min-width: 0;
    }

    .top-search {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: white;
      padding: 13px 16px;
      outline: none;
      font-size: 14px;
    }

    .top-search::placeholder {
      color: var(--muted-2);
    }

    .top-link,
    .toolbar-btn,
    .mini-btn,
    .section-nav-btn,
    .category-chip,
    .carousel-nav {
      transition: .16s ease;
    }

    .top-link {
      text-decoration: none;
      color: #fff;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .top-link.primary {
      background: var(--primary);
      border: none;
    }

    .top-link:hover,
    .toolbar-btn:hover,
    .mini-btn:hover,
    .stream-card:hover,
    .profile-card:hover,
    .carousel-card:hover,
    .category-chip:hover,
    .section-card:hover,
    .section-nav-btn:hover {
      transform: translateY(-1px);
    }

    .page {
      max-width: 1380px;
      margin: 0 auto;
      padding: 12px 14px 40px;
    }

    .toolbar-wrap {
      margin-bottom: 18px;
    }

    .toolbar-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar-btn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: white;
      border-radius: 18px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .toolbar-btn.primary {
      background: var(--primary);
      border: none;
    }

    .filters-panel {
      display: none;
      margin-top: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .filters-panel.show {
      display: block;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .filters-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .input, .select {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 18px;
      color: white;
      padding: 14px 16px;
      outline: none;
      font-size: 15px;
    }

    .select option {
      color: #111827;
    }

    .btn-small {
      border: none;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      color: white;
    }

    .btn-primary { background: var(--primary); }
    .btn-secondary {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
    }

    .section {
      margin-bottom: 28px;
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 28px;
      letter-spacing: -.03em;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
      font-weight: 800;
    }

    .carousel-shell {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 18px;
      overflow: hidden;
    }

    .carousel-stage {
      position: relative;
      display: grid;
      grid-template-columns: 52px 1fr 52px;
      align-items: center;
      gap: 12px;
    }

    .carousel-nav {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      z-index: 2;
    }

    .carousel-nav:disabled {
      opacity: .35;
      cursor: not-allowed;
      transform: none;
    }

    .carousel-viewport {
      overflow: hidden;
      width: 100%;
      min-width: 0;
    }

    .carousel-track {
      display: flex;
      align-items: center;
      gap: 18px;
      transition: transform .35s ease;
      will-change: transform;
      padding: 6px 0;
    }

    .carousel-card {
      flex: 0 0 calc(50% - 9px);
      min-width: 0;
      text-decoration: none;
      color: inherit;
      position: relative;
      transition: .18s ease;
    }

    .carousel-media {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 22px;
      overflow: hidden;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,.06);
      box-shadow: 0 20px 40px rgba(0,0,0,.22);
    }

    .carousel-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .carousel-card.side {
      opacity: .82;
      transform: scale(.94);
    }

    .carousel-card.active {
      opacity: 1;
      transform: scale(1);
      z-index: 2;
    }

    .live-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--danger);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      z-index: 2;
    }

    .viewer-chip {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(2,6,23,.72);
      border: 1px solid rgba(255,255,255,.08);
      color: #fff;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 999px;
      z-index: 2;
    }

    .carousel-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      min-width: 0;
    }

    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      overflow: hidden;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,.08);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-2);
      font-size: 12px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .carousel-text {
      min-width: 0;
    }

    .carousel-title {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .carousel-sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    .carousel-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: none;
      background: rgba(255,255,255,.18);
      cursor: pointer;
    }

    .carousel-dot.active {
      width: 28px;
      background: linear-gradient(90deg, #8b5cf6, #38bdf8);
    }

    .category-rail-wrap {
      margin-top: 18px;
    }

    .category-rail {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 8px;
      scrollbar-width: none;
    }

    .category-rail::-webkit-scrollbar { display: none; }

    .category-chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }

    .category-chip svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: .95;
    }

    .category-chip .icon-stroke { stroke: currentColor; }
    .category-chip .icon-fill { fill: currentColor; }

    .category-chip.active {
      background: var(--primary);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 10px 24px rgba(56,189,248,.18);
    }

    .slider-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .slider-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .slider-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.02em;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .slider-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-nav-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .section-nav-btn:disabled {
      opacity: .35;
      cursor: not-allowed;
      transform: none;
    }

    .slider-viewport {
      overflow: hidden;
      width: 100%;
    }

    .slider-track {
      display: flex;
      gap: 16px;
      transition: transform .35s ease;
      will-change: transform;
      padding: 4px 0;
    }

    .section-card {
      flex: 0 0 calc((100% - 48px) / 4);
      min-width: 0;
      text-decoration: none;
      color: inherit;
      background: rgba(255,255,255,.025);
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 22px;
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .section-card:hover {
      transform: scale(1.03);
      box-shadow: 0 16px 36px rgba(0,0,0,.24);
    }

    .card-cover {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0f172a;
      overflow: hidden;
    }

    .card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-status {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      z-index: 2;
    }

    .card-status.live { background: var(--danger); }
    .card-status.soon { background: var(--success); }

    .card-rank {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(2,6,23,.72);
      border: 1px solid rgba(255,255,255,.08);
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      z-index: 2;
    }

    .card-viewers {
      position: absolute;
      bottom: 12px;
      left: 12px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(2,6,23,.72);
      border: 1px solid rgba(255,255,255,.08);
      font-size: 12px;
      color: #fff;
      z-index: 2;
    }

    .card-body {
      padding: 14px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 6px;
      line-height: 1.35;
    }

    .card-sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .mini-btn {
      text-decoration: none;
      color: #fff;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .mini-btn.primary {
      background: var(--primary);
      border: none;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .profile-card {
      text-decoration: none;
      color: inherit;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: .15s ease;
    }

    .profile-cover {
      padding: 18px 18px 0;
    }

    .profile-head {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .role-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 800;
      margin-top: 6px;
    }

    .profile-live {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--danger);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 800;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: -290px;
      width: 280px;
      height: 100vh;
      z-index: 100;
      background: linear-gradient(180deg, rgba(8,15,33,.98), rgba(3,8,20,.98));
      border-right: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      transition: left .25s ease;
      padding: 18px 16px;
      overflow-y: auto;
    }

    .side-menu.show { left: 0; }

    .side-menu-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .side-menu-title {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(90deg, #60a5fa, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .close-menu-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .side-section { margin-bottom: 18px; }

    .side-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .side-nav {
      display: grid;
      gap: 10px;
    }

    .side-nav a,
    .side-nav button {
      text-decoration: none;
      color: #fff;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .side-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.55);
      z-index: 90;
      display: none;
    }

    .side-backdrop.show { display: block; }

    @media (max-width: 1280px) {
      .section-card {
        flex: 0 0 calc((100% - 32px) / 3);
      }
    }

    @media (max-width: 1100px) {
      .filters-grid {
        grid-template-columns: 1fr 1fr;
      }

      .profile-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .topbar {
        grid-template-columns: auto 1fr auto auto;
      }

      .top-link.primary {
        display: none;
      }

      .carousel-card {
        flex: 0 0 100%;
      }

      .carousel-card.side {
        opacity: 1;
        transform: scale(1);
      }

      .section-card {
        flex: 0 0 calc((100% - 16px) / 2);
      }
    }

    @media (max-width: 760px) {
      .topbar {
        padding: 12px;
        grid-template-columns: auto 1fr auto;
        gap: 8px;
      }

      .brand { font-size: 24px; }

      .top-link {
        padding: 10px 12px;
        font-size: 12px;
      }

      .toolbar-row {
        justify-content: stretch;
      }

      .toolbar-btn {
        flex: 1;
      }

      .filters-grid {
        grid-template-columns: 1fr;
      }

      .profile-grid {
        grid-template-columns: 1fr;
      }

      .section-title {
        font-size: 24px;
      }

      .carousel-stage {
        grid-template-columns: 1fr;
      }

      .carousel-nav {
        display: none;
      }

      .carousel-title {
        font-size: 18px;
      }

      .slider-header {
        align-items: flex-start;
      }

      .section-card {
        flex: 0 0 86%;
      }
    }
  </style>
</head>
<body>
  <div id="side-backdrop" class="side-backdrop"></div>

  <aside id="side-menu" class="side-menu">
    <div class="side-menu-top">
      <div class="side-menu-title">Celivo</div>
      <button id="close-menu-btn" class="close-menu-btn" type="button">✕</button>
    </div>

    <div class="side-section">
      <div class="side-label">Gezin</div>
      <div class="side-nav">
        <a href="#featured-section">Popüler yayınlar</a>
        <a href="#followed-section">Takip ettiğin yayıncılar</a>
        <a href="#live-section">Canlı yayınlar</a>
        <a href="#new-section">Yeni başlayan yayıncılar</a>
        <a href="#scheduled-section">İleri tarihli yayınlar</a>
        <a href="#profiles-section">Kullanıcılar</a>
      </div>
    </div>

    <div class="side-section">
      <div class="side-label">Hızlı işlemler</div>
      <div class="side-nav">
        <a href="/login.html">Giriş yap</a>
        <a href="/profile.html">Profilim</a>
        <a href="/profile.html">Yayına başla</a>
      </div>
    </div>

    <div class="side-section">
      <div class="side-label">Kategori</div>
      <div class="side-nav" id="side-category-links">
        <button type="button" data-category="">Tümü</button>
      </div>
    </div>
  </aside>

  <header class="topbar">
    <div class="left-wrap">
      <button id="menu-btn" class="menu-btn" type="button">☰</button>
      <div class="brand">Celivo</div>
    </div>

    <div class="top-search-wrap">
      <input id="search-input" class="top-search" type="text" placeholder="Yayın, yayıncı, kategori veya şehir ara..." />
    </div>

    <a class="top-link" href="/login.html" id="login-link">Giriş yap</a>
    <a class="top-link" href="/profile.html">Profil</a>
    <a class="top-link primary" href="/profile.html">Yayına başla</a>
  </header>

  <main class="page">
    <section class="toolbar-wrap">
      <div class="toolbar-row">

    function safe(value, fallback = '') {
      return String(value ?? fallback)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatViewers(count) {
      const n = Number(count || 0);
      if (n >= 1000000) return `${(n / 1000000).toFixed(1)} M`;
      if (n >= 1000) return `${(n / 1000).toFixed(1)} B`;
      return `${n}`;
    }

    function formatDate(dateValue) {
      if (!dateValue) return '';
      const d = new Date(dateValue);
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleString('tr-TR', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function getThumb(stream, index = 0) {
      if (stream.thumbnail_url) return stream.thumbnail_url;
      if (stream.avatar_url) return stream.avatar_url;

      const fallbacks = [
        'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80',
        'https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1200&q=80',
        'https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?auto=format&fit=crop&w=1200&q=80',
        'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1200&q=80'
      ];
      return fallbacks[index % fallbacks.length];
    }

    function getRoleLabel(role) {
      const map = {
        free: 'FREE',
        premium: 'PREMIUM',
        vip: 'VIP'
      };
      return map[String(role || 'free').toLowerCase()] || 'FREE';
    }

    function openMenu() {
      sideMenu.classList.add('show');
      sideBackdrop.classList.add('show');
    }

    function closeMenu() {
      sideMenu.classList.remove('show');
      sideBackdrop.classList.remove('show');
    }

    async function loadCurrentUser() {
      const { data, error } = await supabase.auth.getSession();
      if (error) {
        console.error(error);
        currentUser = null;
        return;
      }
      currentUser = data?.session?.user || null;
      if (currentUser) {
        loginLink.style.display = 'none';
      } else {
        loginLink.style.display = 'inline-flex';
      }
    }

    async function loadFollowingIds() {
      if (!currentUser) {
        followingIds = [];
        return;
      }

      const { data, error } = await supabase
        .from('follows')
        .select('following_id')
        .eq('follower_id', currentUser.id);

      if (error) {
        console.error(error);
        followingIds = [];
        return;
      }

      followingIds = (data || []).map(item => item.following_id).filter(Boolean);
    }

    async function loadLocationData() {
      const [countriesRes, citiesRes] = await Promise.all([
        fetch('/countries.json'),
        fetch('/cities.json')
      ]);

      countries = await countriesRes.json();
      citiesByCountry = await citiesRes.json();
      fillCountryFilter();
    }

    function fillCountryFilter() {
      countryFilter.innerHTML = '<option value="">Ülke</option>';
      countries.forEach(country => {
        const option = document.createElement('option');
        option.value = country;
        option.textContent = country;
        countryFilter.appendChild(option);
      });
    }

    function fillCityFilter(country) {
      cityFilter.innerHTML = '<option value="">Şehir</option>';
      const cities = citiesByCountry[country] || [];
      cities.forEach(city => {
        const option = document.createElement('option');
        option.value = city;
        option.textContent = city;
        cityFilter.appendChild(option);
      });
    }

    function fillCategoryFilter() {
      const currentValue = categoryFilter.value;

      categoryFilter.innerHTML = '<option value="">Kategori</option>';
      FIXED_CATEGORIES.forEach(category => {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = category;
        categoryFilter.appendChild(option);
      });

      if (FIXED_CATEGORIES.includes(currentValue)) {
        categoryFilter.value = currentValue;
      }

      renderSideCategoryLinks(FIXED_CATEGORIES);
      renderCategoryRail();
    }

      sideCategoryLinks.innerHTML = `
        <button type="button" data-category="">Tümü</button>
        ${categories.map(category => `
          <button type="button" data-category="${safe(category)}">${safe(category)}</button>
        `).join('')}
      `;

      Array.from(sideCategoryLinks.querySelectorAll('[data-category]')).forEach(btn => {
        btn.onclick = () => {
          categoryFilter.value = btn.dataset.category || '';
          renderCategoryRail();
          applyAll();
          closeMenu();
        };
      });
    }

    function renderCategoryRail() {
      const activeCategory = categoryFilter.value || '';

      categoryRail.innerHTML = `
        <button class="category-chip ${activeCategory === '' ? 'active' : ''}" type="button" data-category="">
          ${getCategoryIcon('Tümü')}
          <span>Tümü</span>
        </button>
        ${FIXED_CATEGORIES.map(category => `
          <button class="category-chip ${activeCategory === category ? 'active' : ''}" type="button" data-category="${safe(category)}">
            ${getCategoryIcon(category)}
            <span>${safe(category)}</span>
          </button>
        `).join('')}
      `;

      Array.from(categoryRail.querySelectorAll('[data-category]')).forEach(btn => {
        btn.onclick = () => {
          categoryFilter.value = btn.dataset.category || '';
          renderCategoryRail();
          applyAll();
        };
      });
    }

    function inAgeRange(age, range) {
      const a = Number(age || 0);
      if (!range) return true;
      if (range === '13-17') return a >= 13 && a <= 17;
      if (range === '18-24') return a >= 18 && a <= 24;
      if (range === '25-34') return a >= 25 && a <= 34;
      if (range === '35-44') return a >= 35 && a <= 44;
      if (range === '45-54') return a >= 45 && a <= 54;
      if (range === '55+') return a >= 55;
      return true;
    }

    function liveMatchesFilters(stream) {
      const country = countryFilter.value;
      const city = cityFilter.value;
      const gender = genderFilter.value;
      const ageRange = ageFilter.value;
      const category = categoryFilter.value;

      if (country && stream.country !== country) return false;
      if (city && stream.city !== city) return false;
      if (gender && stream.gender !== gender) return false;
      if (category && stream.category !== category) return false;
      if (!inAgeRange(stream.age, ageRange)) return false;

      return true;
    }

    function streamMatchesSearch(stream, q) {
      if (!q) return true;
      const searchable = [
        stream.title,
        stream.category,
        stream.streamer_name,
        stream.username,
        stream.country,
        stream.city
      ].join(' ').toLowerCase();

      return searchable.includes(q);
    }

    function profileMatchesSearch(profile, q) {
      if (!q) return true;
      const searchable = [
        profile.username,
        profile.country,
        profile.city,
        profile.gender,
        profile.bio
      ].join(' ').toLowerCase();

      return searchable.includes(q);
    }

    function updateLiveCountBadge(count) {
      liveCountBadge.textContent = `(${count})`;
    }

    function getMaxCarouselIndex(total) {
      if (visibleCards === 1) return Math.max(0, total - 1);
      return Math.max(0, total - 2);
    }

    function updateCarouselPosition() {
      const cards = Array.from(featuredTrack.querySelectorAll('.carousel-card'));
      if (!cards.length) {
        carouselPrev.disabled = true;
        carouselNext.disabled = true;
        carouselDots.innerHTML = '';
        return;
      }

      const maxIndex = getMaxCarouselIndex(cards.length);
      if (carouselIndex > maxIndex) carouselIndex = maxIndex;

      const firstCard = cards[0];
      const style = window.getComputedStyle(featuredTrack);
      const gap = parseFloat(style.columnGap || style.gap || 18);
      const cardWidth = firstCard.offsetWidth + gap;
      const translateX = cardWidth * carouselIndex;

      featuredTrack.style.transform = `translateX(-${translateX}px)`;

      cards.forEach((card, idx) => {
        card.classList.remove('active', 'side');
        if (visibleCards === 1) {
          if (idx === carouselIndex) card.classList.add('active');
        } else {
          if (idx === carouselIndex || idx === carouselIndex + 1) {
            card.classList.add('active');
          } else if (idx === carouselIndex - 1 || idx === carouselIndex + 2) {
            card.classList.add('side');
          }
        }
      });

      carouselPrev.disabled = carouselIndex <= 0;
      carouselNext.disabled = carouselIndex >= maxIndex;

      const dotCount = maxIndex + 1;
      carouselDots.innerHTML = Array.from({ length: dotCount }).map((_, idx) => `
        <button class="carousel-dot ${idx === carouselIndex ? 'active' : ''}" data-index="${idx}" type="button"></button>
      `).join('');

      Array.from(carouselDots.querySelectorAll('.carousel-dot')).forEach(dot => {
        dot.onclick = () => {
          carouselIndex = Number(dot.dataset.index || 0);
          updateCarouselPosition();
        };
      });
    }

    function renderFeaturedCarousel(streams) {
      featuredTrack.innerHTML = '';

      if (!streams.length) {
        featuredTrack.innerHTML = `<div class="empty" style="width:100%;">Popüler yayın bulunamadı.</div>`;
        carouselPrev.disabled = true;
        carouselNext.disabled = true;
        carouselDots.innerHTML = '';
        return;
      }

      featuredTrack.innerHTML = streams.map((stream, index) => `
        <a class="carousel-card" href="/stream.html?id=${stream.id}">
          <div class="carousel-media">
            <img src="${safe(getThumb(stream, index))}" alt="${safe(stream.title)}" />
            <div class="live-badge">CANLI</div>
            <div class="viewer-chip">👁 ${safe(formatViewers(stream.viewer_count))} izleyici</div>
          </div>

          <div class="carousel-meta">
            <div class="avatar">
              ${stream.avatar_url ? `<img src="${safe(stream.avatar_url)}" alt="${safe(stream.username || stream.streamer_name || 'Yayıncı')}">` : '👤'}
            </div>
            <div class="carousel-text">
              <div class="carousel-title">${safe(stream.title)}</div>
              <div class="carousel-sub">
                ${safe(stream.streamer_name || stream.username || 'Yayıncı')} • ${safe(stream.category || 'Just Chatting')}
              </div>
            </div>
          </div>
        </a>
      `).join('');

      updateCarouselPosition();
    }

    function buildSectionCard(stream, index, type = 'live') {
      const isScheduled = type === 'scheduled';
      const statusLabel = isScheduled ? 'PLANLI' : 'CANLI';
      const statusClass = isScheduled ? 'soon' : 'live';
      const rank = type === 'followed' ? 'Takipte' : type === 'new' ? 'Yeni' : type === 'scheduled' ? 'Yakında' : `Trend #${index + 1}`;
      const secondaryInfo = isScheduled
        ? `${safe(stream.streamer_name || stream.username || 'Yayıncı')} • ${safe(stream.category || '')}<br/>${stream.scheduled_at ? formatDate(stream.scheduled_at) : 'Tarih eklenecek'}`
        : `${safe(stream.streamer_name || stream.username || 'Yayıncı')} • ${safe(stream.category || '')}`;

      return `
        <a class="section-card" href="/stream.html?id=${stream.id}">
          <div class="card-cover">
            <img src="${safe(getThumb(stream, index))}" alt="${safe(stream.title)}" />
            <div class="card-status ${statusClass}">${statusLabel}</div>
            <div class="card-rank">${safe(rank)}</div>
            <div class="card-viewers">👁 ${isScheduled ? (stream.scheduled_at ? safe(formatDate(stream.scheduled_at)) : 'Yakında') : safe(formatViewers(stream.viewer_count || 0))}</div>
          </div>
          <div class="card-body">
            <div class="card-title">${safe(stream.title || 'Canlı yayın')}</div>
            <div class="card-sub">${secondaryInfo}</div>

            <div class="card-tags">
              ${stream.category ? `<span class="tag-pill">${safe(stream.category)}</span>` : ''}
              ${type === 'followed' ? `<span class="tag-pill">Takipte</span>` : ''}
              ${type === 'new' ? `<span class="tag-pill">Yeni keşif</span>` : ''}
              ${type === 'scheduled' ? `<span class="tag-pill">İleri tarihli</span>` : ''}
            </div>

            <div class="card-actions">
              <span class="mini-btn primary">${isScheduled ? 'Hatırlat' : 'İzle'}</span>
              <span class="mini-btn">Profil</span>
              <span class="mini-btn">Takip et</span>
            </div>
          </div>
        </a>
      `;
    }

    function renderSliderSection(container, options) {
      const {
        id,
        title,
        items,
        type = 'live',
        emptyText = 'Gösterilecek yayın bulunamadı.'
      } = options;

      if (!items.length) {
        container.innerHTML = `
          <div class="slider-section">
            <div class="slider-header">
              <div class="slider-title">${safe(title)}</div>
            </div>
            <div class="empty">${safe(emptyText)}</div>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="slider-section">
          <div class="slider-header">
            <div class="slider-title">${safe(title)} <span class="count-badge">(${items.length})</span></div>
            <div class="slider-tools">
              <button id="${id}-prev" class="section-nav-btn" type="button">‹</button>
              <button id="${id}-next" class="section-nav-btn" type="button">›</button>
            </div>
          </div>

          <div class="slider-viewport">
            <div id="${id}-track" class="slider-track">
              ${items.map((item, index) => buildSectionCard(item, index, type)).join('')}
            </div>
          </div>
        </div>
      `;

      const track = document.getElementById(`${id}-track`);
      const prev = document.getElementById(`${id}-prev`);
      const next = document.getElementById(`${id}-next`);
      let index = 0;

      const getVisibleCount = () => {
        if (window.innerWidth <= 760) return 1;
        if (window.innerWidth <= 1280) return 3;
        return 4;
      };

      const update = () => {
        const cards = Array.from(track.children);
        if (!cards.length) {
          prev.disabled = true;
          next.disabled = true;
          return;
        }

        const visible = getVisibleCount();
        const maxIndex = Math.max(0, cards.length - visible);
        if (index > maxIndex) index = maxIndex;

        const firstCard = cards[0];
        const style = window.getComputedStyle(track);
        const gap = parseFloat(style.columnGap || style.gap || 16);
        const cardWidth = firstCard.offsetWidth + gap;
        track.style.transform = `translateX(-${index * cardWidth}px)`;

        prev.disabled = index <= 0;
        next.disabled = index >= maxIndex;
      };

      prev.onclick = () => {
        index = Math.max(0, index - 1);
        update();
      };

      next.onclick = () => {
        const cards = Array.from(track.children);
        const visible = getVisibleCount();
        const maxIndex = Math.max(0, cards.length - visible);
        index = Math.min(maxIndex, index + 1);
        update();
      };

      const onResize = () => update();
      window.addEventListener('resize', onResize);

      update();
    }

    function renderProfiles(profiles, liveStreams) {
      const liveStreamerIds = new Set(liveStreams.map(x => x.streamer_id));

      if (!profiles.length) {
        profilesGrid.innerHTML = '';
        emptyProfiles.style.display = 'block';
        return;
      }

      emptyProfiles.style.display = 'none';

      profilesGrid.innerHTML = profiles.map(profile => {
        const liveStream = liveStreams.find(x => x.streamer_id === profile.id);
        const href = liveStream ? `/stream.html?id=${encodeURIComponent(liveStream.id)}` : `/profile.html?id=${encodeURIComponent(profile.id)}`;

        return `
          <a class="profile-card" href="${href}">
            <div class="profile-cover">
              <div class="profile-head">
                <div class="avatar">
                  ${profile.avatar_url ? `<img src="${safe(profile.avatar_url)}" alt="${safe(profile.username)}">` : '👤'}
                </div>
                <div>
                  <div class="card-title" style="margin-bottom:4px;">${safe(profile.username || 'Kullanıcı')}</div>
                  <div class="card-sub">
                    ${safe(profile.country || '')}${profile.city ? ' • ' + safe(profile.city) : ''}${profile.gender ? ' • ' + safe(profile.gender) : ''}${profile.age ? ' • ' + safe(profile.age + ' yaş') : ''}
                  </div>
                  <div class="role-pill">${safe(getRoleLabel(profile.role || profile.subscription_status || 'free'))}</div>
                </div>
              </div>

              ${liveStreamerIds.has(profile.id) ? '<div class="profile-live">● Şu an canlı</div>' : ''}
            </div>

            <div class="card-body">
              <div class="card-sub">${safe(profile.bio || 'Henüz biyografi eklenmedi.')}</div>

              <div class="card-actions">
                <span class="mini-btn">Profili aç</span>
                ${liveStreamerIds.has(profile.id) ? '<span class="mini-btn primary">Canlıya git</span>' : ''}
              </div>
            </div>
          </a>
        `;
      }).join('');
    }

    async function fetchProfiles() {
      const { data: profilesData, error: profilesError } = await supabase
        .from('profiles')
        .select('*')
        .order('updated_at', { ascending: false });

      if (profilesError) {
        console.error(profilesError);
        return [];
      }

      return profilesData || [];
    }

    async function fetchLiveStreams() {
      const { data: streamsData, error: streamError } = await supabase
        .from('streams')
        .select('*')
        .eq('is_live', true)
        .order('viewer_count', { ascending: false });

      if (streamError) {
        console.error(streamError);
        return [];
      }

      return streamsData || [];
    }

    async function fetchScheduledStreams() {
      const nowIso = new Date().toISOString();

      const { data, error } = await supabase
        .from('streams')
        .select('*')
        .eq('is_live', false)
        .gte('scheduled_at', nowIso)
        .order('scheduled_at', { ascending: true })
        .limit(20);

      if (error) {
        console.error(error);
        return [];
      }

      return data || [];
    }

    function enrichStreams(streams, profiles) {
      return streams.map(stream => {
        const profile = profiles.find(p => p.id === stream.streamer_id);
        return {
          ...stream,
          username: profile?.username || '',
          avatar_url: profile?.avatar_url || '',
          country: profile?.country || '',
          city: profile?.city || '',
          gender: profile?.gender || '',
          age: profile?.age || null,
          role: profile?.role || profile?.subscription_status || 'free',
          bio: profile?.bio || '',
          followers_count: Number(profile?.followers_count || 0),
          updated_profile_at: profile?.updated_at || null
        };
      });
    }

    async function loadData() {
      if (!countries.length) {
        await loadLocationData();
      }

      await loadCurrentUser();
      await loadFollowingIds();

      const [profilesData, liveStreamsData, scheduledStreamsData] = await Promise.all([
        fetchProfiles(),
        fetchLiveStreams(),
        fetchScheduledStreams()
      ]);

      allProfiles = profilesData;
      const enrichedLiveStreams = enrichStreams(liveStreamsData, allProfiles);
      const enrichedScheduledStreams = enrichStreams(scheduledStreamsData, allProfiles);

      allStreams = [...enrichedLiveStreams, ...enrichedScheduledStreams];
      fillCategoryFilter();
      applyAll();
    }

    function applyAll() {
      const q = searchInput.value.trim().toLowerCase();

      const filteredLiveStreams = allStreams
        .filter(stream => stream.is_live === true)
        .filter(stream => liveMatchesFilters(stream))
        .filter(stream => streamMatchesSearch(stream, q))
        .sort((a, b) => Number(b.viewer_count || 0) - Number(a.viewer_count || 0));

      const filteredScheduledStreams = allStreams
        .filter(stream => stream.is_live === false && stream.scheduled_at)
        .filter(stream => liveMatchesFilters(stream))
        .filter(stream => streamMatchesSearch(stream, q))
        .sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));

      const searchedProfiles = allProfiles
        .filter(profile => profileMatchesSearch(profile, q));

      const followedStreams = filteredLiveStreams
        .filter(stream => followingIds.includes(stream.streamer_id))
        .slice(0, 16);

      const liveStreams = filteredLiveStreams.slice(0, 20);

      const newStartingStreams = [...filteredLiveStreams]
        .sort((a, b) => {
          const af = Number(a.followers_count || 0);
          const bf = Number(b.followers_count || 0);
          if (af !== bf) return af - bf;
          return new Date(b.updated_profile_at || 0) - new Date(a.updated_profile_at || 0);
        })
        .slice(0, 16);

      const scheduledStreams = filteredScheduledStreams.slice(0, 16);

      updateLiveCountBadge(filteredLiveStreams.length);
      renderFeaturedCarousel(filteredLiveStreams.slice(0, 8));

      renderSliderSection(followedSlider, {
        id: 'followed',
        title: 'Takip ettiğin yayıncılar',
        items: followedStreams,
        type: 'followed',
        emptyText: currentUser
          ? 'Takip ettiğin yayıncılardan şu anda yayında olan yok.'
          : 'Bu alanı görmek için giriş yapıp yayıncı takip etmelisin.'
      });

      renderSliderSection(liveSlider, {
        id: 'live',
        title: 'Canlı yayınlar',
        items: liveStreams,
        type: 'live',
        emptyText: 'Şu anda canlı yayın bulunamadı.'
      });

      renderSliderSection(newSlider, {
        id: 'new',
        title: 'Yeni başlayan yayıncılar',
        items: newStartingStreams,
        type: 'new',
        emptyText: 'Yeni başlayan yayıncı bulunamadı.'
      });

      renderSliderSection(scheduledSlider, {
        id: 'scheduled',
        title: 'İleri tarihli yayınlar',
        items: scheduledStreams,
        type: 'scheduled',
        emptyText: 'Henüz ileri tarihli yayın planı yok.'
      });

      renderProfiles(searchedProfiles, filteredLiveStreams);
    }

    function startAutoRefresh() {
      if (refreshTimer) return;
      loadData();
      refreshTimer = setInterval(loadData, 4000);
    }

    function handleResize() {
      visibleCards = window.innerWidth <= 900 ? 1 : 2;
      updateCarouselPosition();
    }

    menuBtn.onclick = openMenu;
    closeMenuBtn.onclick = closeMenu;
    sideBackdrop.onclick = closeMenu;

    toggleFiltersBtn.onclick = () => {
      filtersPanel.classList.toggle('show');
    };

    applyFiltersBtn.onclick = () => {
      applyAll();
      filtersPanel.classList.remove('show');
    };

    clearFiltersBtn.onclick = () => {
      countryFilter.value = '';
      fillCityFilter('');
      cityFilter.value = '';
      genderFilter.value = '';
      ageFilter.value = '';
      categoryFilter.value = '';
      searchInput.value = '';
      renderCategoryRail();
      applyAll();
    };

    searchInput.oninput = applyAll;

    countryFilter.onchange = () => {
      fillCityFilter(countryFilter.value);
    };

    cityFilter.onchange = applyAll;
    genderFilter.onchange = applyAll;
    ageFilter.onchange = applyAll;
    categoryFilter.onchange = () => {
      renderCategoryRail();
      applyAll();
    };

    carouselPrev.onclick = () => {
      const total = featuredTrack.querySelectorAll('.carousel-card').length;
      const maxIndex = getMaxCarouselIndex(total);
      carouselIndex = Math.max(0, carouselIndex - 1);
      if (carouselIndex > maxIndex) carouselIndex = maxIndex;
      updateCarouselPosition();
    };

    carouselNext.onclick = () => {
      const total = featuredTrack.querySelectorAll('.carousel-card').length;
      carouselIndex = Math.min(getMaxCarouselIndex(total), carouselIndex + 1);
      updateCarouselPosition();
    };

    window.addEventListener('resize', handleResize);

    startAutoRefresh();
  </script>
</body>
