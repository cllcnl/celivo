<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celivo</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --border: rgba(255,255,255,.08);
      --muted: #cbd5e1;
      --muted-2: #94a3b8;
      --card: rgba(10,17,36,.92);
      --shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,.18), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(168,85,247,.16), transparent 26%),
        radial-gradient(circle at 50% 80%, rgba(56,189,248,.12), transparent 34%),
        linear-gradient(180deg, #040816 0%, #020617 100%);
    }

    .topbar {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -.04em;
      background: linear-gradient(90deg, #60a5fa, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .top-link {
      text-decoration: none;
      color: #fff;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
    }

    .page {
      max-width: 1300px;
      margin: 0 auto;
      padding: 8px 16px 40px;
    }

    .hero {
      margin-bottom: 24px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 56px;
      line-height: 1;
      letter-spacing: -.05em;
    }

    .hero p {
      margin: 0;
      max-width: 760px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 16px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr 1fr;
      gap: 12px;
      margin: 24px 0;
    }

    .input, .select {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 18px;
      color: white;
      padding: 14px 16px;
      outline: none;
      font-size: 15px;
    }

    .featured {
      display: grid;
      grid-template-columns: 1.25fr .9fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .featured-main, .featured-side {
      background: linear-gradient(180deg, rgba(12,20,40,.9), rgba(6,11,25,.96));
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .cover {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #0f172a;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .live-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: linear-gradient(90deg, #ef4444 0%, #f97316 100%);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 999px;
    }

    .viewer-chip {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(2,6,23,.72);
      border: 1px solid rgba(255,255,255,.08);
      color: #fff;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 999px;
    }

    .featured-content {
      padding: 18px;
    }

    .featured-content h2 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -.03em;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .featured-side-inner {
      padding: 18px;
    }

    .featured-side h3 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .mini-list {
      display: grid;
      gap: 12px;
    }

    .mini-card {
      display: flex;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px;
    }

    .mini-thumb {
      width: 120px;
      aspect-ratio: 16/9;
      border-radius: 12px;
      overflow: hidden;
      background: #0f172a;
      flex-shrink: 0;
    }

    .mini-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mini-meta .title {
      font-weight: 800;
      margin-bottom: 4px;
      line-height: 1.35;
    }

    .mini-meta .sub {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .grid-title {
      margin: 0 0 16px;
      font-size: 28px;
      letter-spacing: -.03em;
    }

    .stream-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .stream-card {
      text-decoration: none;
      color: inherit;
      background: linear-gradient(180deg, rgba(12,20,40,.9), rgba(6,11,25,.96));
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: .15s ease;
    }

    .stream-card:hover {
      transform: translateY(-2px);
    }

    .card-body {
      padding: 14px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 6px;
      line-height: 1.35;
    }

    .card-sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    @media (max-width: 1100px) {
      .toolbar {
        grid-template-columns: 1fr 1fr;
      }
      .featured {
        grid-template-columns: 1fr;
      }
      .stream-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .hero h1 { font-size: 42px; }
      .toolbar { grid-template-columns: 1fr; }
      .stream-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Celivo</div>
    <div class="top-actions">
      <a class="top-link" href="/login.html">Giriş yap</a>
      <a class="top-link" href="/profile.html">Profil</a>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <h1>Sadece izleme. Yayının parçası ol.</h1>
      <p>Celivo’da yayın sadece izlenmez. Sohbete katıl, yayıncıyı takip et, ilgine göre yayınları filtrele ve canlı akışın içinde ol.</p>
    </section>

    <section class="toolbar">
      <input id="search-input" class="input" type="text" placeholder="Yayıncı, başlık veya kategori ara..." />
      <select id="country-filter" class="select">
        <option value="">Ülke</option>
      </select>
      <select id="city-filter" class="select">
        <option value="">Şehir</option>
      </select>
      <select id="gender-filter" class="select">
        <option value="">Cinsiyet</option>
        <option value="Erkek">Erkek</option>
        <option value="Kadın">Kadın</option>
        <option value="Belirtmek istemiyorum">Belirtmek istemiyorum</option>
        <option value="Diğer">Diğer</option>
      </select>
      <select id="age-filter" class="select">
        <option value="">Yaş aralığı</option>
        <option value="18-24">18-24</option>
        <option value="25-34">25-34</option>
        <option value="35-44">35-44</option>
        <option value="45-54">45-54</option>
        <option value="55+">55+</option>
      </select>
    </section>

    <section class="featured" id="featured-wrap"></section>

    <section>
      <h2 class="grid-title">Şu an canlı</h2>
      <div id="streams-grid" class="stream-grid"></div>
      <div id="empty-state" class="empty" style="display:none;">Filtreye uygun canlı yayın bulunamadı.</div>
    </section>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabase = createClient(
      'https://nxxnhqtqvrkbdhltoijz.supabase.co',
      'sb_publishable_YKoXoU5eJNyO7bYBKWh73g_0RDK7bF0'
    );

    let allStreams = [];
    let allProfiles = [];
    let countries = [];
    let citiesByCountry = {};

    const searchInput = document.getElementById('search-input');
    const countryFilter = document.getElementById('country-filter');
    const cityFilter = document.getElementById('city-filter');
    const genderFilter = document.getElementById('gender-filter');
    const ageFilter = document.getElementById('age-filter');

    const featuredWrap = document.getElementById('featured-wrap');
    const grid = document.getElementById('streams-grid');
    const empty = document.getElementById('empty-state');

    function safe(value, fallback = '') {
      return String(value ?? fallback)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatViewers(count) {
      const n = Number(count || 0);
      if (n >= 1000) return `${(n / 1000).toFixed(1)} B`;
      return `${n}`;
    }

    function getThumb(stream, index = 0) {
      if (stream.avatar_url) return stream.avatar_url;
      const fallbacks = [
        'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80',
        'https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1200&q=80',
        'https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?auto=format&fit=crop&w=1200&q=80',
        'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1200&q=80'
      ];
      return fallbacks[index % fallbacks.length];
    }

    function fillCountryFilter() {
      countryFilter.innerHTML = '<option value="">Ülke</option>';
      countries.forEach(country => {
        const option = document.createElement('option');
        option.value = country;
        option.textContent = country;
        countryFilter.appendChild(option);
      });
    }

    function fillCityFilter(country) {
      cityFilter.innerHTML = '<option value="">Şehir</option>';
      const cities = citiesByCountry[country] || [];
      cities.forEach(city => {
        const option = document.createElement('option');
        option.value = city;
        option.textContent = city;
        cityFilter.appendChild(option);
      });
    }

    function inAgeRange(age, range) {
      const a = Number(age || 0);
      if (!range) return true;
      if (range === '18-24') return a >= 18 && a <= 24;
      if (range === '25-34') return a >= 25 && a <= 34;
      if (range === '35-44') return a >= 35 && a <= 44;
      if (range === '45-54') return a >= 45 && a <= 54;
      if (range === '55+') return a >= 55;
      return true;
    }

    function filterStreams() {
      const q = searchInput.value.trim().toLowerCase();
      const country = countryFilter.value;
      const city = cityFilter.value;
      const gender = genderFilter.value;
      const ageRange = ageFilter.value;

      const filtered = allStreams.filter(stream => {
        const searchable = [
          stream.title,
          stream.category,
          stream.streamer_name,
          stream.country,
          stream.city
        ].join(' ').toLowerCase();

        if (q && !searchable.includes(q)) return false;
        if (country && stream.country !== country) return false;
        if (city && stream.city !== city) return false;
        if (gender && stream.gender !== gender) return false;
        if (!inAgeRange(stream.age, ageRange)) return false;

        return true;
      });

      renderFeatured(filtered);
      renderGrid(filtered);
    }

    function renderFeatured(streams) {
      if (!streams.length) {
        featuredWrap.innerHTML = '';
        return;
      }

      const [main, ...rest] = streams;
      const side = rest.slice(0, 3);

      featuredWrap.innerHTML = `
        <a class="featured-main" href="/stream.html?id=${main.id}">
          <div class="cover">
            <img src="${safe(getThumb(main))}" alt="${safe(main.title)}" />
            <div class="live-badge">CANLI</div>
            <div class="viewer-chip">👁 ${safe(formatViewers(main.viewer_count))} izleyici</div>
          </div>
          <div class="featured-content">
            <h2>${safe(main.title)}</h2>
            <div class="meta">
              ${safe(main.streamer_name || 'Yayıncı')} • ${safe(main.category || 'Just Chatting')}<br/>
              ${safe(main.country || '')}${main.city ? ' • ' + safe(main.city) : ''}${main.gender ? ' • ' + safe(main.gender) : ''}${main.age ? ' • ' + safe(main.age + ' yaş') : ''}
            </div>
          </div>
        </a>

        <div class="featured-side">
          <div class="featured-side-inner">
            <h3>Öne çıkan diğer canlılar</h3>
            <div class="mini-list">
              ${side.length ? side.map((stream, index) => `
                <a class="mini-card" href="/stream.html?id=${stream.id}">
                  <div class="mini-thumb">
                    <img src="${safe(getThumb(stream, index + 1))}" alt="${safe(stream.title)}" />
                  </div>
                  <div class="mini-meta">
                    <div class="title">${safe(stream.title)}</div>
                    <div class="sub">${safe(stream.streamer_name || 'Yayıncı')} • ${safe(stream.category || '')}<br/>👁 ${safe(formatViewers(stream.viewer_count))}</div>
                  </div>
                </a>
              `).join('') : '<div class="card-sub">Başka canlı yayın yok.</div>'}
            </div>
          </div>
        </div>
      `;
    }

    function renderGrid(streams) {
      if (!streams.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';

      grid.innerHTML = streams.map((stream, index) => `
        <a class="stream-card" href="/stream.html?id=${stream.id}">
          <div class="cover">
            <img src="${safe(getThumb(stream, index))}" alt="${safe(stream.title)}" />
            <div class="live-badge">CANLI</div>
            <div class="viewer-chip">👁 ${safe(formatViewers(stream.viewer_count))}</div>
          </div>
          <div class="card-body">
            <div class="card-title">${safe(stream.title)}</div>
            <div class="card-sub">
              ${safe(stream.streamer_name || 'Yayıncı')} • ${safe(stream.category || '')}<br/>
              ${safe(stream.country || '')}${stream.city ? ' • ' + safe(stream.city) : ''}${stream.gender ? ' • ' + safe(stream.gender) : ''}${stream.age ? ' • ' + safe(stream.age + ' yaş') : ''}
            </div>
          </div>
        </a>
      `).join('');
    }

    async function loadData() {
      const [countriesRes, citiesRes] = await Promise.all([
        fetch('/countries.json'),
        fetch('/cities.json')
      ]);

      countries = await countriesRes.json();
      citiesByCountry = await citiesRes.json();
      fillCountryFilter();

      const { data: streamsData, error: streamError } = await supabase
        .from('streams')
        .select('*')
        .eq('is_live', true)
        .order('viewer_count', { ascending: false });

      if (streamError) {
        console.error(streamError);
        renderFeatured([]);
        renderGrid([]);
        return;
      }

      const streamerIds = [...new Set((streamsData || []).map(x => x.streamer_id).filter(Boolean))];

      let profilesData = [];
      if (streamerIds.length) {
        const { data, error } = await supabase
          .from('profiles')
          .select('id, avatar_url, country, city, gender, age')
          .in('id', streamerIds);

        if (!error && data) profilesData = data;
      }

      allProfiles = profilesData;

      allStreams = (streamsData || []).map(stream => {
        const profile = allProfiles.find(p => p.id === stream.streamer_id);
        return {
          ...stream,
          avatar_url: profile?.avatar_url || '',
          country: profile?.country || '',
          city: profile?.city || '',
          gender: profile?.gender || '',
          age: profile?.age || null
        };
      });

      filterStreams();
    }

    searchInput.oninput = filterStreams;
    countryFilter.onchange = () => {
      fillCityFilter(countryFilter.value);
      filterStreams();
    };
    cityFilter.onchange = filterStreams;
    genderFilter.onchange = filterStreams;
    ageFilter.onchange = filterStreams;

    loadData();
    setInterval(loadData, 10000);
  </script>
</body>
</html>
