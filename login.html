<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celivo - Giriş Yap</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: #050816;
      color: white;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      width: min(420px, calc(100% - 24px));
      background: #0d1326;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      padding: 28px;
    }
    h1 { margin-top: 0; }
    input, button {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.08);
      margin-top: 12px;
      box-sizing: border-box;
      font: inherit;
    }
    input {
      background: rgba(255,255,255,.04);
      color: white;
      padding: 0 14px;
    }
    button {
      border: 0;
      color: white;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(90deg, #7c5cff, #48c6ff);
    }
    .msg { margin-top: 14px; color: #9fb0c7; }
    a { color: #7fd6ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Giriş Yap</h1>
    <form id="login-form">
      <input id="email" type="email" placeholder="E-posta" required />
      <input id="password" type="password" placeholder="Şifre" required />
      <button type="submit">Giriş Yap</button>
    </form>
    <div class="msg" id="msg"></div>
    <p class="msg">Hesabın yok mu? <a href="/register.html">Kayıt ol</a></p>
  </div>

  <script type="module">
    import { signIn } from './auth.js';

    const form = document.getElementById('login-form');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await signIn(email, password);
        msg.textContent = 'Giriş başarılı. Ana sayfaya yönlendiriliyorsun...';
        setTimeout(() => {
          window.location.href = '/';
        }, 800);
      } catch (err) {
        msg.textContent = err.message || 'Giriş başarısız.';
      }
    });
  </script>
</body>
</html>
