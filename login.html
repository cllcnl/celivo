<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celivo - Giriş Yap</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,.18), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(168,85,247,.16), transparent 26%),
        radial-gradient(circle at 50% 80%, rgba(37,99,235,.14), transparent 30%),
        linear-gradient(180deg, #030712 0%, #020617 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, rgba(15,23,42,.88), rgba(6,10,28,.96));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0 0 22px;
      font-size: 38px;
      letter-spacing: -.04em;
    }

    .field { margin-bottom: 14px; }

    .input {
      width: 100%;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      color: #fff;
      padding: 15px 16px;
      border-radius: 16px;
      outline: none;
      font-size: 15px;
    }

    .input::placeholder { color: #94a3b8; }

    .btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(90deg, #8b5cf6 0%, #38bdf8 100%);
    }

    .btn-secondary {
      color: #fff;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
    }

    .footer {
      margin-top: 14px;
      color: #cbd5e1;
      font-size: 14px;
    }

    .footer a {
      color: #7dd3fc;
    }

    .status {
      min-height: 22px;
      margin-top: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Giriş Yap</h1>

    <div class="field">
      <input id="email" class="input" type="email" placeholder="E-posta" />
    </div>

    <div class="field">
      <input id="password" class="input" type="password" placeholder="Şifre" />
    </div>

    <button id="login-btn" class="btn btn-primary" type="button">Giriş Yap</button>
    <button id="forgot-btn" class="btn btn-secondary" type="button">Şifremi unuttum</button>

    <div class="footer">
      Hesabın yok mu? <a href="/register.html">Kayıt ol</a>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://nxxnhqtqvrkbdhltoijz.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_YKoXoU5eJNyO7bYBKWh73g_0RDK7bF0';

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const loginBtn = document.getElementById('login-btn');
    const forgotBtn = document.getElementById('forgot-btn');
    const statusEl = document.getElementById('status');

    function setStatus(message = '', isError = true) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? '#f87171' : '#4ade80';
    }

    async function login() {
      const email = emailEl.value.trim();
      const password = passwordEl.value;

      if (!email || !password) {
        setStatus('E-posta ve şifre gir.');
        return;
      }

      setStatus('');

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        setStatus('Giriş başarısız: ' + error.message);
        return;
      }

      localStorage.setItem('loggedIn', 'true');
      setStatus('Giriş başarılı, yönlendiriliyorsun...', false);

      window.location.href = '/profile.html';
    }

    async function resetPassword() {
      const email = emailEl.value.trim();

      if (!email) {
        setStatus('Önce e-posta gir.');
        return;
      }

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/profile.html'
      });

      if (error) {
        setStatus('Şifre sıfırlama başarısız: ' + error.message);
        return;
      }

      setStatus('Şifre sıfırlama maili gönderildi.', false);
    }

    loginBtn.addEventListener('click', login);
    forgotBtn.addEventListener('click', resetPassword);

    passwordEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
