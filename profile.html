<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil | Celivo</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b0f1a;
      color: white;
    }

    .container {
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      background: #121826;
      border-radius: 12px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      background: #1c2333;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg,#7b5cff,#00c2ff);
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
    }

    .success { color: #00ffae; }
    .error { color: #ff4d4d; }
  </style>
</head>

<body>

<div class="container">
  <h2>Profil</h2>

  <input id="username" placeholder="Kullanıcı adı"/>
  <input id="avatar" placeholder="Avatar URL"/>
  <input id="bio" placeholder="Bio"/>

  <button onclick="saveProfile()">Kaydet</button>
  <button onclick="startStream()">Yayına Başla 🔴</button>

  <div id="status" class="status"></div>
</div>

<script>
  // 🔥 SENİN API BİLGİLERİN
  const supabase = window.supabase.createClient(
    "https://cllcnl.supabase.co",  // BURAYA SENİN PROJECT URL (değiştir!)
    "sb_publishable_YKoXoU5eJNyO7bYBKWh73g_0RDK7bF0"
  );

  function setStatus(msg, type = '') {
    const el = document.getElementById('status');
    el.innerText = msg;
    el.className = 'status ' + type;
  }

  async function getUser() {
    const { data } = await supabase.auth.getSession();
    return data?.session?.user || null;
  }

  async function loadProfile() {
    const user = await getUser();

    if (!user) {
      setStatus("Oturum yok. Login'e yönlendiriliyor...", "error");
      setTimeout(() => {
        window.location.href = "/login.html";
      }, 1500);
      return;
    }

    document.getElementById("username").value =
      user.user_metadata?.username || "";

    document.getElementById("avatar").value =
      user.user_metadata?.avatar || "";

    document.getElementById("bio").value =
      user.user_metadata?.bio || "";
  }

  async function saveProfile() {
    const user = await getUser();
    if (!user) return;

    const username = document.getElementById("username").value;
    const avatar = document.getElementById("avatar").value;
    const bio = document.getElementById("bio").value;

    const { error } = await supabase.auth.updateUser({
      data: {
        username,
        avatar,
        bio
      }
    });

    if (error) {
      setStatus("Kaydedilemedi", "error");
      return;
    }

    setStatus("Profil kaydedildi ✅", "success");
  }

  async function startStream() {
    const user = await getUser();
    if (!user) return;

    const title = prompt("Yayın başlığı gir:");
    if (!title) return;

    const category = prompt("Kategori gir:", "Just Chatting");

    const { error } = await supabase.from("streams").insert({
      title: title,
      category: category,
      is_live: true,
      viewer_count: 0,
      streamer_id: user.id,
      streamer_name: user.email
    });

    if (error) {
      console.error(error);
      setStatus("Yayın başlatılamadı ❌", "error");
      return;
    }

    setStatus("Yayın başladı 🔥", "success");

    // 🔥 ANA SAYFAYA YÖNLENDİR
    setTimeout(() => {
      window.location.href = "/index.html";
    }, 1200);
  }

  loadProfile();
</script>

</body>
</html>
