<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celivo - Profil</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: white;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,.16), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(168,85,247,.16), transparent 28%),
        radial-gradient(circle at 50% 80%, rgba(56,189,248,.12), transparent 35%),
        linear-gradient(180deg, #040816 0%, #030712 100%);
    }

    .topbar {
      width: 100%;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-weight: 800;
      font-size: 30px;
      letter-spacing: -0.04em;
      background: linear-gradient(90deg, #60a5fa, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-home {
      text-decoration: none;
      color: #fff;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 16px 40px;
    }

    .hero {
      margin-bottom: 24px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 52px;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .hero p {
      margin: 0;
      color: #cbd5e1;
      max-width: 720px;
      line-height: 1.6;
      font-size: 16px;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 22px;
    }

    .card {
      background: linear-gradient(180deg, rgba(14,23,42,.88), rgba(8,15,30,.96));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    .preview-card {
      padding: 26px 22px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar-ring {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #60a5fa, #8b5cf6, #ec4899);
      padding: 4px;
      margin-bottom: 18px;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #0f172a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.4;
      padding: 10px;
      border: 2px solid rgba(255,255,255,.08);
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview-name {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .role-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      font-size: 14px;
      font-weight: 700;
      color: #e2e8f0;
      text-transform: capitalize;
      margin-bottom: 18px;
    }

    .preview-bio {
      color: #cbd5e1;
      line-height: 1.65;
      font-size: 15px;
      width: 100%;
    }

    .form-card {
      padding: 28px 24px;
    }

    .section-title {
      margin: 0 0 18px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
    }

    .input, .textarea {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      color: white;
      border-radius: 18px;
      padding: 15px 16px;
      outline: none;
      font-size: 15px;
      transition: .2s ease;
    }

    .input[readonly] {
      opacity: .9;
      cursor: default;
    }

    .input::placeholder,
    .textarea::placeholder {
      color: #94a3b8;
    }

    .input:focus,
    .textarea:focus {
      border-color: rgba(96,165,250,.75);
      box-shadow: 0 0 0 4px rgba(59,130,246,.12);
    }

    .textarea {
      min-height: 150px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      border: none;
      border-radius: 18px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      color: white;
    }

    .btn-primary {
      background: linear-gradient(90deg, #8b5cf6 0%, #38bdf8 100%);
      box-shadow: 0 12px 30px rgba(56,189,248,.16);
    }

    .btn-secondary {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
    }

    .btn-danger {
      background: linear-gradient(90deg, #ef4444 0%, #f97316 100%);
      box-shadow: 0 12px 30px rgba(239,68,68,.16);
    }

    .status {
      margin-top: 16px;
      min-height: 24px;
      font-weight: 700;
      font-size: 14px;
    }

    .status.success { color: #4ade80; }
    .status.error { color: #f87171; }
    .status.info { color: #93c5fd; }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 40px;
      }

      .row-2 {
        grid-template-columns: 1fr;
      }

      .preview-card {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Celivo</div>
    <a href="/index.html" class="back-home">← Ana sayfaya dön</a>
  </header>

  <main class="page">
    <section class="hero">
      <h1>Profilini düzenle</h1>
      <p>Kullanıcı adını, avatarını ve kısa biyografini güncelle. Kaydettiğin bilgiler profil ve canlı yayın görünümünde kullanılacak.</p>
    </section>

    <section class="layout">
      <aside class="card preview-card">
        <div class="avatar-ring">
          <div class="avatar-inner" id="avatar-preview">Avatar önizleme</div>
        </div>

        <div class="preview-name" id="preview-name">Kullanıcı</div>
        <div class="role-pill" id="preview-role">free</div>
        <div class="preview-bio" id="preview-bio">Henüz biyografi eklenmedi.</div>
      </aside>

      <section class="card form-card">
        <h2 class="section-title">Hesap bilgileri</h2>

        <div class="row-2">
          <div class="field">
            <label for="email">E-posta</label>
            <input id="email" class="input" type="email" readonly />
          </div>

          <div class="field">
            <label for="role">Rol</label>
            <input id="role" class="input" type="text" readonly />
          </div>
        </div>

        <div class="field">
          <label for="username">Kullanıcı adı</label>
          <input id="username" class="input" type="text" maxlength="30" placeholder="Örn: canlicelil754" />
        </div>

        <div class="field">
          <label for="avatar_url">Avatar URL</label>
          <input id="avatar_url" class="input" type="url" placeholder="https://..." />
        </div>

        <div class="field">
          <label for="bio">Bio</label>
          <textarea id="bio" class="textarea" maxlength="300" placeholder="Kendini kısa tanıt..."></textarea>
        </div>

        <div class="actions">
          <button id="save-btn" class="btn btn-primary" type="button">Kaydet</button>
          <button id="logout-btn" class="btn btn-secondary" type="button">Çıkış yap</button>
          <button id="go-live-btn" class="btn btn-danger" type="button">🔴 Yayına Başla</button>
        </div>

        <div id="status" class="status"></div>
      </section>
    </section>
  </main>

  <script>
    const supabase = window.supabase.createClient(
      'https://nxxnhqtqvrkbdhltoijz.supabase.co',
      'sb_publishable_YKoXoU5eJNyO7bYBKWh73g_0RDK7bF0'
    );

    const emailEl = document.getElementById('email');
    const roleEl = document.getElementById('role');
    const usernameEl = document.getElementById('username');
    const avatarUrlEl = document.getElementById('avatar_url');
    const bioEl = document.getElementById('bio');

    const previewNameEl = document.getElementById('preview-name');
    const previewRoleEl = document.getElementById('preview-role');
    const previewBioEl = document.getElementById('preview-bio');
    const avatarPreviewEl = document.getElementById('avatar-preview');

    const saveBtn = document.getElementById('save-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const goLiveBtn = document.getElementById('go-live-btn');
    const statusEl = document.getElementById('status');

    function setStatus(message = '', type = 'info') {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
    }

    function setAvatarPreview(url) {
      const value = (url || '').trim();

      if (!value) {
        avatarPreviewEl.innerHTML = 'Avatar önizleme';
        return;
      }

      avatarPreviewEl.innerHTML = `<img src="${value}" alt="Avatar" onerror="this.parentElement.innerHTML='Avatar yüklenemedi';">`;
    }

    function updatePreview() {
      previewNameEl.textContent = usernameEl.value.trim() || 'Kullanıcı';
      previewRoleEl.textContent = roleEl.value.trim() || 'free';
      previewBioEl.textContent = bioEl.value.trim() || 'Henüz biyografi eklenmedi.';
      setAvatarPreview(avatarUrlEl.value);
    }

    async function getUser() {
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        console.error(error);
        return null;
      }

      return data?.session?.user || null;
    }

    async function loadProfile() {
      const user = await getUser();

      if (!user) {
        setStatus('Oturum bulunamadı. Giriş sayfasına yönlendiriliyorsun...', 'error');
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1200);
        return;
      }

      emailEl.value = user.email || '';
      roleEl.value = user.user_metadata?.role || 'free';

      const { data: profile, error } = await supabase
        .from('profiles')
        .select('username, avatar_url, bio, role')
        .eq('id', user.id)
        .maybeSingle();

      if (error) {
        console.error(error);
        setStatus('Profil yüklenirken hata oluştu: ' + error.message, 'error');
        updatePreview();
        return;
      }

      usernameEl.value = profile?.username || user.user_metadata?.username || '';
      avatarUrlEl.value = profile?.avatar_url || '';
      bioEl.value = profile?.bio || '';
      roleEl.value = profile?.role || roleEl.value || 'free';

      updatePreview();
      setStatus('', 'info');
    }

    async function saveProfile() {
      const user = await getUser();
      if (!user) {
        setStatus('Oturum bulunamadı.', 'error');
        return;
      }

      const payload = {
        id: user.id,
        username: usernameEl.value.trim() || null,
        avatar_url: avatarUrlEl.value.trim() || null,
        bio: bioEl.value.trim() || null,
        role: roleEl.value.trim() || 'free'
      };

      const { error } = await supabase
        .from('profiles')
        .upsert(payload, { onConflict: 'id' });

      if (error) {
        console.error(error);
        setStatus('Profil kaydedilemedi: ' + error.message, 'error');
        return;
      }

      updatePreview();
      setStatus('Profil başarıyla kaydedildi.', 'success');
    }

    async function logout() {
      const { error } = await supabase.auth.signOut();

      if (error) {
        console.error(error);
        setStatus('Çıkış yapılamadı: ' + error.message, 'error');
        return;
      }

      localStorage.removeItem('loggedIn');
      window.location.href = '/login.html';
    }

    async function goLive() {
      const user = await getUser();

      if (!user) {
        setStatus('Önce giriş yapmalısın.', 'error');
        return;
      }

      const title = prompt('Yayın başlığı gir:');
      if (!title) return;

      const category = prompt('Kategori gir:', 'Just Chatting') || 'Just Chatting';

      const { error } = await supabase
        .from('streams')
        .insert({
          id: crypto.randomUUID(),
          streamer_id: user.id,
          title,
          category,
          is_live: true,
          viewer_count: 99,
          streamer_name: usernameEl.value.trim() || user.email || 'Yayıncı'
        });

      if (error) {
        console.error(error);
        alert('Yayın başlatılamadı: ' + error.message);
        return;
      }

      alert('Yayın başladı 🔥');
      window.location.href = '/index.html';
    }

    saveBtn.addEventListener('click', saveProfile);
    logoutBtn.addEventListener('click', logout);
    goLiveBtn.addEventListener('click', goLive);

    usernameEl.addEventListener('input', updatePreview);
    avatarUrlEl.addEventListener('input', updatePreview);
    bioEl.addEventListener('input', updatePreview);

    loadProfile();
  </script>
</body>
</html>
