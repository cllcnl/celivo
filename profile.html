<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celivo - Profil</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,.18), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(168,85,247,.16), transparent 26%),
        radial-gradient(circle at 50% 80%, rgba(37,99,235,.14), transparent 30%),
        linear-gradient(180deg, #030712 0%, #020617 100%);
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 18px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      background: rgba(2,6,23,.72);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.03em;
      background: linear-gradient(90deg, #60a5fa 0%, #a855f7 55%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-link {
      text-decoration: none;
      color: #e5e7eb;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }

    .hero {
      margin-bottom: 24px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 42px;
      line-height: 1.02;
      letter-spacing: -.04em;
    }

    .hero p {
      margin: 0;
      color: #cbd5e1;
      font-size: 16px;
      line-height: 1.6;
      max-width: 760px;
    }

    .grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 22px;
    }

    .card {
      background: linear-gradient(180deg, rgba(15,23,42,.84), rgba(6,10,28,.94));
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 28px;
      box-shadow: 0 18px 48px rgba(0,0,0,.35);
    }

    .preview-card {
      padding: 28px 24px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
    }

    .avatar-ring {
      width: 138px;
      height: 138px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #60a5fa, #8b5cf6, #ec4899);
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #0f172a;
      border: 3px solid rgba(255,255,255,.08);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.3;
      text-align: center;
      padding: 12px;
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview-name {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      color: #e5e7eb;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 20px;
      text-transform: capitalize;
    }

    .preview-bio {
      color: #cbd5e1;
      font-size: 16px;
      line-height: 1.65;
    }

    .form-card {
      padding: 28px 24px;
    }

    .section-title {
      font-size: 32px;
      font-weight: 800;
      margin: 0 0 18px;
      letter-spacing: -.03em;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 16px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #f8fafc;
      font-weight: 700;
      font-size: 14px;
    }

    .input,
    .textarea {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      color: #fff;
      padding: 16px 18px;
      outline: none;
      font-size: 16px;
      transition: .2s ease;
    }

    .input::placeholder,
    .textarea::placeholder {
      color: #94a3b8;
    }

    .input:focus,
    .textarea:focus {
      border-color: rgba(96,165,250,.75);
      box-shadow: 0 0 0 4px rgba(96,165,250,.12);
    }

    .input[readonly] {
      opacity: .88;
      cursor: default;
    }

    .textarea {
      min-height: 150px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      border: none;
      border-radius: 18px;
      padding: 14px 22px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .14s ease, opacity .14s ease, box-shadow .14s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(90deg, #8b5cf6 0%, #38bdf8 100%);
      box-shadow: 0 10px 24px rgba(56,189,248,.18);
    }

    .btn-secondary {
      color: #fff;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
    }

    .btn-danger {
      color: #fff;
      background: linear-gradient(90deg, #ef4444 0%, #f97316 100%);
      box-shadow: 0 10px 24px rgba(239,68,68,.18);
    }

    .status {
      margin-top: 16px;
      min-height: 24px;
      font-size: 15px;
      font-weight: 700;
    }

    .status.success {
      color: #4ade80;
    }

    .status.error {
      color: #f87171;
    }

    .status.info {
      color: #93c5fd;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 34px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .preview-card {
        min-height: unset;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Celivo</div>
    <a class="back-link" href="/index.html">← Ana sayfaya dön</a>
  </header>

  <main class="page">
    <section class="hero">
      <h1>Profilini düzenle</h1>
      <p>Kullanıcı adını, avatarını ve kısa biyografini güncelle. Kaydettiğin bilgiler chat ve profil görünümünde kullanılacak.</p>
    </section>

    <section class="grid">
      <aside class="card preview-card">
        <div class="avatar-ring">
          <div class="avatar-inner" id="avatar-preview">
            Avatar önizleme
          </div>
        </div>
        <div class="preview-name" id="preview-name">Kullanıcı</div>
        <div class="badge" id="preview-role">free</div>
        <div class="preview-bio" id="preview-bio">Henüz biyografi eklenmedi.</div>
      </aside>

      <section class="card form-card">
        <h2 class="section-title">Hesap bilgileri</h2>

        <div class="form-grid">
          <div class="field">
            <label for="email">E-posta</label>
            <input id="email" class="input" type="email" readonly />
          </div>

          <div class="field">
            <label for="role">Rol</label>
            <input id="role" class="input" type="text" readonly />
          </div>
        </div>

        <div class="field">
          <label for="username">Kullanıcı adı</label>
          <input id="username" class="input" type="text" maxlength="30" placeholder="Örn: canlicelil754" />
        </div>

        <div class="field">
          <label for="avatar_url">Avatar URL</label>
          <input id="avatar_url" class="input" type="url" placeholder="https://..." />
        </div>

        <div class="field">
          <label for="bio">Bio</label>
          <textarea id="bio" class="textarea" maxlength="300" placeholder="Kendini kısa tanıt..."></textarea>
        </div>

        <div class="actions">
          <button id="save-btn" class="btn btn-primary" type="button">Kaydet</button>
          <button id="logout-btn" class="btn btn-secondary" type="button">Çıkış yap</button>
          <button id="go-live-btn" class="btn btn-danger" type="button">🔴 Yayına Başla</button>
        </div>

        <div id="status" class="status"></div>
      </section>
    </section>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://nxxnhqtqvrkbdhltoijz.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_YKoXoU5eJNy07bYBKWh73g_0RDK7bF0';

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const emailEl = document.getElementById('email');
    const roleEl = document.getElementById('role');
    const usernameEl = document.getElementById('username');
    const avatarUrlEl = document.getElementById('avatar_url');
    const bioEl = document.getElementById('bio');

    const previewNameEl = document.getElementById('preview-name');
    const previewRoleEl = document.getElementById('preview-role');
    const previewBioEl = document.getElementById('preview-bio');
    const avatarPreviewEl = document.getElementById('avatar-preview');

    const saveBtn = document.getElementById('save-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const goLiveBtn = document.getElementById('go-live-btn');
    const statusEl = document.getElementById('status');

    function setStatus(message = '', type = 'info') {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
    }

    function setAvatarPreview(url) {
      const cleanUrl = (url || '').trim();

      if (!cleanUrl) {
        avatarPreviewEl.innerHTML = 'Avatar önizleme';
        return;
      }

      avatarPreviewEl.innerHTML = `<img src="${cleanUrl}" alt="Avatar" onerror="this.parentElement.innerHTML='Avatar yüklenemedi';" />`;
    }

    function updatePreview() {
      const username = usernameEl.value.trim() || 'Kullanıcı';
      const role = roleEl.value.trim() || 'free';
      const bio = bioEl.value.trim() || 'Henüz biyografi eklenmedi.';

      previewNameEl.textContent = username;
      previewRoleEl.textContent = role;
      previewBioEl.textContent = bio;
      setAvatarPreview(avatarUrlEl.value);
    }

    async function requireUser() {
      const { data, error } = await supabase.auth.getUser();

      if (error) {
        console.error(error);
        window.location.href = '/login.html';
        return null;
      }

      const user = data?.user;

      if (!user) {
        window.location.href = '/login.html';
        return null;
      }

      return user;
    }

    async function loadProfile() {
      const user = await requireUser();
      if (!user) return;

      emailEl.value = user.email || '';
      roleEl.value = user.user_metadata?.role || 'free';

      const { data: profile, error } = await supabase
        .from('profiles')
        .select('username, avatar_url, bio, role')
        .eq('id', user.id)
        .maybeSingle();

      if (error) {
        console.error(error);
        setStatus('Profil bilgileri yüklenemedi.', 'error');
        updatePreview();
        return;
      }

      usernameEl.value = profile?.username || user.user_metadata?.username || '';
      avatarUrlEl.value = profile?.avatar_url || '';
      bioEl.value = profile?.bio || '';
      roleEl.value = profile?.role || roleEl.value || 'free';

      updatePreview();
    }

    async function saveProfile() {
      const user = await requireUser();
      if (!user) return;

      const payload = {
        id: user.id,
        username: usernameEl.value.trim() || null,
        avatar_url: avatarUrlEl.value.trim() || null,
        bio: bioEl.value.trim() || null,
        role: roleEl.value.trim() || 'free'
      };

      const { error } = await supabase
        .from('profiles')
        .upsert(payload, { onConflict: 'id' });

      if (error) {
        console.error(error);
        setStatus('Profil kaydedilemedi: ' + error.message, 'error');
        return;
      }

      updatePreview();
      setStatus('Profil başarıyla kaydedildi.', 'success');
    }

    async function logout() {
      const { error } = await supabase.auth.signOut();

      if (error) {
        console.error(error);
        setStatus('Çıkış yapılırken hata oluştu.', 'error');
        return;
      }

      window.location.href = '/login.html';
    }

    async function goLive() {
      const user = await requireUser();
      if (!user) return;

      const title = prompt('Yayın başlığı gir:');
      if (!title) return;

      const category = prompt('Kategori gir:', 'Just Chatting') || 'Just Chatting';

      const { error } = await supabase
        .from('streams')
        .insert({
          id: crypto.randomUUID(),
          streamer_id: user.id,
          title,
          category,
          is_live: true,
          viewer_count: 99,
          streamer_name: usernameEl.value.trim() || 'Yayıncı'
        });

      if (error) {
        console.error(error);
        alert('Yayın başlatılamadı: ' + error.message);
        return;
      }

      alert('Yayın başladı 🔥');
      window.location.href = '/index.html';
    }

    saveBtn.addEventListener('click', saveProfile);
    logoutBtn.addEventListener('click', logout);
    goLiveBtn.addEventListener('click', goLive);

    usernameEl.addEventListener('input', updatePreview);
    avatarUrlEl.addEventListener('input', updatePreview);
    bioEl.addEventListener('input', updatePreview);

    loadProfile();
  </script>
</body>
</html>
