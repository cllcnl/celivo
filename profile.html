 
 <!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0b0f1a;
  color:white;
}

.container{
  max-width:500px;
  margin:40px auto;
  padding:20px;
}

.card{
  background:#111827;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
}

input, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  background:#1f2937;
  color:white;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:12px;
  font-weight:bold;
  cursor:pointer;
}

.primary{background:linear-gradient(90deg,#7c3aed,#06b6d4);}
.danger{background:linear-gradient(90deg,#ef4444,#f97316);}
.dark{background:#1f2937;}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>Profil</h2>

<input id="username" placeholder="Kullanıcı adı">
<input id="avatar" placeholder="Avatar URL">
<input id="bio" placeholder="Bio">

<button class="primary" onclick="saveProfile()">Kaydet</button>
<button class="dark" onclick="logout()">Çıkış yap</button>
</div>

<div class="card">
<h3>Cüzdan</h3>
<p id="balance">₺0</p>
<button class="primary" onclick="addBalance()">Cüzdana yükle</button>
<button class="dark" onclick="showTransactions()">Hareketler</button>
</div>

<div class="card">
<h3>Abonelik</h3>
<p id="plan">Free</p>
<button class="primary" onclick="buyPlan()">Abonelik satın al</button>
</div>

<div class="card">
<h3>Yayın başlat</h3>

<input id="title" placeholder="Yayın başlığı">
<select id="category">
<option>Just Chatting</option>
<option>Oyun</option>
<option>Futbol</option>
</select>

<button class="danger" onclick="startStream()">Yayına Başla</button>
</div>

</div>

<script>
const supabase = window.supabase.createClient(
  "https://nxxnhqtqvrkbdhltoijz.supabase.co",
  "sb_publishable_YKoXoU5eJNyO7bYBKWh73g_0RDK7bF0"
);

let user = null;

async function init(){
  const { data } = await supabase.auth.getUser();

  if(!data.user){
    window.location.href="/login.html";
    return;
  }

  user = data.user;

  loadProfile();
}

async function loadProfile(){
  const { data } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if(data){
    username.value = data.username || "";
    avatar.value = data.avatar_url || "";
    bio.value = data.bio || "";
    balance.innerText = "₺" + (data.balance || 0);
    plan.innerText = data.plan || "Free";
  }
}

async function saveProfile(){
  const { error } = await supabase
    .from("profiles")
    .upsert({
      id: user.id,
      username: username.value,
      avatar_url: avatar.value,
      bio: bio.value
    });

  if(error){
    alert("Kaydedilemedi");
  }else{
    alert("Kaydedildi");
  }
}

async function logout(){
  await supabase.auth.signOut();
  window.location.href="/login.html";
}

async function startStream(){
  const { error } = await supabase
    .from("streams")
    .insert({
      title: title.value,
      category: category.value,
      is_live: true,
      streamer_id: user.id
    });

  if(error){
    alert("Yayın başlatılamadı");
  }else{
    alert("Yayın başladı 🔥");
    window.location.href="/index.html";
  }
}

async function addBalance(){
  const amount = prompt("Yüklenecek tutar:");

  if(!amount) return;

  const { error } = await supabase.rpc("add_balance", {
    uid: user.id,
    amount: Number(amount)
  });

  if(!error){
    alert("Yüklendi");
    loadProfile();
  }
}

function showTransactions(){
  alert("Yakında aktif");
}

async function buyPlan(){
  const newPlan = prompt("free / premium / vip");

  if(!newPlan) return;

  await supabase
    .from("profiles")
    .update({ plan: newPlan })
    .eq("id", user.id);

  alert("Plan güncellendi");
  loadProfile();
}

init();
</script>

</body>
</html>
