<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celivo - Yayın</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --border: rgba(255,255,255,.08);
      --muted: #cbd5e1;
      --muted-2: #94a3b8;
      --shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,.18), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(168,85,247,.16), transparent 26%),
        radial-gradient(circle at 50% 80%, rgba(56,189,248,.12), transparent 34%),
        linear-gradient(180deg, #040816 0%, #020617 100%);
    }

    .topbar {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.04em;
      background: linear-gradient(90deg, #60a5fa, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-link {
      text-decoration: none;
      color: #fff;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
    }

    .page {
      max-width: 1320px;
      margin: 0 auto;
      padding: 8px 16px 40px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.3fr .8fr;
      gap: 20px;
    }

    .card {
      background: linear-gradient(180deg, rgba(12,20,40,.9), rgba(6,11,25,.96));
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .player {
      aspect-ratio: 16 / 9;
      background: #0f172a;
      position: relative;
      overflow: hidden;
    }

    .player video,
    .player img,
    .player canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #020617;
    }

    .player-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 20px;
      padding: 24px;
      text-align: center;
    }

    .live-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: linear-gradient(90deg, #ef4444 0%, #f97316 100%);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      z-index: 2;
    }

    .viewer-chip {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(2,6,23,.72);
      border: 1px solid rgba(255,255,255,.08);
      color: #fff;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 999px;
      z-index: 2;
    }

    .content {
      padding: 18px;
    }

    .title {
      font-size: 32px;
      line-height: 1.15;
      letter-spacing: -.04em;
      margin: 0 0 10px;
      font-weight: 800;
    }

    .sub {
      color: var(--muted);
      line-height: 1.65;
      font-size: 15px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .broadcaster-panel {
      margin-top: 18px;
      padding: 16px;
      border-radius: 22px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.06);
      display: none;
    }

    .broadcaster-panel.show {
      display: block;
    }

    .panel-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 12px;
    }

    .panel-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .panel-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .panel-block {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,.06);
    }

    .mini-label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .select,
    .range {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: white;
      padding: 12px 14px;
      outline: none;
      font-size: 14px;
    }

    .range {
      padding: 10px 12px;
    }

    .btn {
      border: none;
      border-radius: 18px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      color: white;
    }

    .btn-primary {
      background: linear-gradient(90deg, #8b5cf6 0%, #38bdf8 100%);
    }

    .btn-secondary {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: linear-gradient(90deg, #ef4444 0%, #f97316 100%);
    }

    .btn-success {
      background: linear-gradient(90deg, #10b981 0%, #06b6d4 100%);
    }

    .btn-disabled {
      opacity: .5;
      cursor: not-allowed;
      filter: grayscale(.15);
    }

    .btn-active {
      box-shadow: 0 0 0 2px rgba(56,189,248,.35) inset;
    }

    .panel-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .support-note {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.06);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .hidden-file {
      display: none;
    }

    .side-card {
      display: flex;
      flex-direction: column;
      min-height: 720px;
    }

    .side-header {
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .side-title {
      margin: 0;
      font-size: 22px;
      letter-spacing: -.03em;
    }

    .chat-messages {
      flex: 1;
      padding: 14px 18px;
      overflow-y: auto;
      max-height: 560px;
    }

    .msg {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .msg-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,.08);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-2);
      font-size: 12px;
    }

    .msg-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .msg-body {
      flex: 1;
    }

    .msg-head {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .msg-head strong {
      color: #fff;
      margin-right: 6px;
    }

    .msg-text {
      line-height: 1.55;
      color: #f8fafc;
      word-break: break-word;
    }

    .chat-form {
      padding: 14px 18px 18px;
      border-top: 1px solid rgba(255,255,255,.06);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .input {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: white;
      padding: 14px 14px;
      outline: none;
      font-size: 15px;
    }

    .status {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      min-height: 22px;
    }

    .hidden-media {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      left: -9999px;
      top: -9999px;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .title {
        font-size: 26px;
      }
      .side-card {
        min-height: auto;
      }
      .panel-grid,
      .panel-grid-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Celivo</div>
    <a href="/index.html" class="back-link">← Ana sayfaya dön</a>
  </header>

  <main class="page">
    <section class="layout">
      <section class="card">
        <div class="player" id="player">
          <div class="live-badge">CANLI</div>
          <div class="viewer-chip" id="viewer-chip">👁 0 izleyici</div>
          <div class="player-placeholder">Yayın yükleniyor...</div>
        </div>

        <div class="content">
          <h1 class="title" id="stream-title">Yayın yükleniyor...</h1>
          <div class="sub" id="stream-sub">...</div>

          <div class="actions">
            <button id="follow-btn" class="btn btn-primary" type="button">Takip et</button>
            <a href="/profile.html" class="btn btn-secondary" style="text-decoration:none;display:inline-flex;align-items:center;">Profil</a>
          </div>

          <div id="broadcaster-panel" class="broadcaster-panel">
            <h3 class="panel-title">Yayıncı kontrol paneli</h3>

            <div class="panel-grid">
              <button id="start-camera-btn" class="btn btn-success" type="button">Kamerayı Aç</button>
              <button id="share-screen-btn" class="btn btn-primary" type="button">Ekran Paylaş</button>
              <button id="toggle-mic-btn" class="btn btn-secondary" type="button">Mikrofon: Açık</button>
              <button id="toggle-screen-audio-btn" class="btn btn-secondary" type="button">Ekran Sesi: Kapalı</button>
            </div>

            <div class="panel-block">
              <div class="panel-grid">
                <div>
                  <label class="mini-label" for="scene-mode">Sahne modu</label>
                  <select id="scene-mode" class="select">
                    <option value="camera_only">Sadece Kamera</option>
                    <option value="screen_only">Sadece Ekran</option>
                    <option value="screen_camera" selected>Ekran + Kamera</option>
                  </select>
                </div>

                <div>
                  <label class="mini-label" for="pip-position">Kamera konumu</label>
                  <select id="pip-position" class="select">
                    <option value="top-left">Sol Üst</option>
                    <option value="top-right">Sağ Üst</option>
                    <option value="bottom-left">Sol Alt</option>
                    <option value="bottom-right" selected>Sağ Alt</option>
                  </select>
                </div>
              </div>

              <div class="panel-grid">
                <div>
                  <label class="mini-label" for="pip-size">Kamera kutusu boyutu</label>
                  <input id="pip-size" class="range" type="range" min="18" max="40" value="24" />
                </div>

                <div>
                  <label class="mini-label" for="camera-shape">Kamera şekli</label>
                  <select id="camera-shape" class="select">
                    <option value="rounded" selected>Yuvarlatılmış</option>
                    <option value="circle">Daire</option>
                    <option value="square">Kare</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="panel-block">
              <div class="panel-grid">
                <div>
                  <label class="mini-label" for="background-mode">Kamera arkası görünüm</label>
                  <select id="background-mode" class="select">
                    <option value="normal" selected>Normal</option>
                    <option value="solid_dark">Koyu Arka Plan</option>
                    <option value="solid_blue">Mavi Arka Plan</option>
                    <option value="preset_1">Hazır Görsel 1</option>
                    <option value="preset_2">Hazır Görsel 2</option>
                    <option value="preset_3">Hazır Görsel 3</option>
                    <option value="custom_image">Özel Görsel</option>
                  </select>
                </div>

                <div>
                  <label class="mini-label" for="upload-background-btn">Özel görsel</label>
                  <button id="upload-background-btn" class="btn btn-secondary" type="button">Görsel Yükle</button>
                  <input id="background-file-input" class="hidden-file" type="file" accept="image/*" />
                </div>
              </div>
            </div>

            <div class="panel-grid-3">
              <button id="apply-scene-btn" class="btn btn-primary" type="button">Sahneyi Uygula</button>
              <button id="stop-preview-btn" class="btn btn-secondary" type="button">Önizlemeyi Durdur</button>
              <button id="stop-stream-btn" class="btn btn-danger" type="button">Yayını Durdur</button>
            </div>

            <div class="panel-note">
              Ekran paylaşımı ana sahne, kamera ise köşede yüz kamerası olarak birleşir. Mikrofon ve ekran sesi ayrı ayrı kontrol edilir. TURN desteği aktif.
            </div>

            <div id="screen-support-note" class="support-note" style="display:none;"></div>
          </div>

          <div class="status" id="page-status"></div>
        </div>
      </section>

      <aside class="card side-card">
        <div class="side-header">
          <h2 class="side-title">Canlı sohbet</h2>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <form class="chat-form" id="chat-form">
          <input id="chat-input" class="input" type="text" placeholder="Mesaj yaz..." maxlength="400" />
          <button class="btn btn-primary" type="submit">Gönder</button>
        </form>
      </aside>
    </section>
  </main>

  <video id="camera-source-video" class="hidden-media" autoplay muted playsinline></video>
  <video id="screen-source-video" class="hidden-media" autoplay muted playsinline></video>
  <canvas id="scene-canvas" class="hidden-media" width="1280" height="720"></canvas>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabase = createClient(
      'https://nxxnhqtqvrkbdhltoijz.supabase.co',
      'sb_publishable_YKoXoU5eJNyO7bYBKWh73g_0RDK7bF0'
    );

    const ICE_SERVERS = [
      { urls: 'stun:stun.relay.metered.ca:80' },
      {
        urls: 'turn:standard.relay.metered.ca:80',
        username: '723792a924e8af5e8e71e264',
        credential: '88xPKO3pAq1AbOfd'
      },
      {
        urls: 'turn:standard.relay.metered.ca:80?transport=tcp',
        username: '723792a924e8af5e8e71e264',
        credential: '88xPKO3pAq1AbOfd'
      },
      {
        urls: 'turn:standard.relay.metered.ca:443',
        username: '723792a924e8af5e8e71e264',
        credential: '88xPKO3pAq1AbOfd'
      },
      {
        urls: 'turns:standard.relay.metered.ca:443?transport=tcp',
        username: '723792a924e8af5e8e71e264',
        credential: '88xPKO3pAq1AbOfd'
      }
    ];

    const VIEWER_ACTIVE_WINDOW_MS = 80000;
    const VIEWER_HEARTBEAT_MS = 3000;
    const VIEWER_COUNT_POLL_MS = 2000;

    const params = new URLSearchParams(window.location.search);
    const streamId = params.get('id');

    const playerEl = document.getElementById('player');
    const streamTitleEl = document.getElementById('stream-title');
    const streamSubEl = document.getElementById('stream-sub');
    const pageStatusEl = document.getElementById('page-status');
    const followBtn = document.getElementById('follow-btn');
    const viewerChipEl = document.getElementById('viewer-chip');

    const broadcasterPanelEl = document.getElementById('broadcaster-panel');
    const startCameraBtn = document.getElementById('start-camera-btn');
    const shareScreenBtn = document.getElementById('share-screen-btn');
    const toggleMicBtn = document.getElementById('toggle-mic-btn');
    const toggleScreenAudioBtn = document.getElementById('toggle-screen-audio-btn');
    const stopStreamBtn = document.getElementById('stop-stream-btn');
    const stopPreviewBtn = document.getElementById('stop-preview-btn');
    const applySceneBtn = document.getElementById('apply-scene-btn');
    const screenSupportNoteEl = document.getElementById('screen-support-note');

    const sceneModeEl = document.getElementById('scene-mode');
    const pipPositionEl = document.getElementById('pip-position');
    const pipSizeEl = document.getElementById('pip-size');
    const cameraShapeEl = document.getElementById('camera-shape');
    const backgroundModeEl = document.getElementById('background-mode');
    const uploadBackgroundBtn = document.getElementById('upload-background-btn');
    const backgroundFileInput = document.getElementById('background-file-input');

    const chatMessagesEl = document.getElementById('chat-messages');
    const chatFormEl = document.getElementById('chat-form');
    const chatInputEl = document.getElementById('chat-input');

    const cameraSourceVideo = document.getElementById('camera-source-video');
    const screenSourceVideo = document.getElementById('screen-source-video');
    const sceneCanvas = document.getElementById('scene-canvas');
    const sceneCtx = sceneCanvas.getContext('2d');

    let currentUser = null;
    let currentStream = null;
    let currentProfile = null;
    let actorId = null;
    let isFollowing = false;
    let isBroadcaster = false;
    let autoStartTried = false;

    let rawCameraStream = null;
    let rawScreenStream = null;
    let outboundStream = null;
    let canvasCaptureStream = null;

    let audioContext = null;
    let audioDestination = null;
    let micSourceNode = null;
    let screenSourceNode = null;
    let micGainNode = null;
    let screenGainNode = null;

    let pc = null;
    let remoteStream = null;
    let processedSignalIds = new Set();
    let signalPollTimer = null;
    let drawLoopHandle = null;
    let customBackgroundUrl = '';

    let viewerHeartbeatTimer = null;
    let viewerCountTimer = null;

    const presetBackgrounds = {
      preset_1: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1600&q=80',
      preset_2: 'https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?auto=format&fit=crop&w=1600&q=80',
      preset_3: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1600&q=80'
    };

    const backgroundImageCache = new Map();

    const sceneState = {
      mode: 'screen_camera',
      pipPosition: 'bottom-right',
      pipSizePercent: 24,
      cameraShape: 'rounded',
      micEnabled: true,
      screenAudioEnabled: false,
      backgroundMode: 'normal'
    };

    function safe(value, fallback = '') {
      return String(value ?? fallback)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatViewers(count) {
      const n = Number(count || 0);
      if (n >= 1000) return `${(n / 1000).toFixed(1)} B`;
      return `${n}`;
    }

    function updateViewerChip(count) {
      viewerChipEl.textContent = `👁 ${formatViewers(count)} izleyici`;
    }

    function getThumb(profile) {
      if (profile?.avatar_url) return profile.avatar_url;
      return 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80';
    }

    function isMobileDevice() {
      return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    }

    function hasScreenShareSupport() {
      return !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
    }

    function getGuestId() {
      let guestId = localStorage.getItem('celivo_guest_id');
      if (!guestId) {
        guestId = crypto.randomUUID();
        localStorage.setItem('celivo_guest_id', guestId);
      }
      return guestId;
    }

    async function ensureActorId() {
      currentUser = await getCurrentUser();
      actorId = currentUser?.id || getGuestId();
      return actorId;
    }

    async function upsertViewerPresence() {
      if (!streamId) return;
      await ensureActorId();

      const { error } = await supabase
        .from('stream_viewers')
        .upsert({
          stream_id: streamId,
          viewer_id: actorId,
          is_active: true,
          last_seen: new Date().toISOString()
        }, { onConflict: 'stream_id,viewer_id' });

      if (error) {
        console.error('Viewer presence yazılamadı:', error);
      }
    }

    async function markViewerInactive() {
      if (!streamId) return;
      await ensureActorId();

      const { error } = await supabase
        .from('stream_viewers')
        .update({
          is_active: false,
          last_seen: new Date().toISOString()
        })
        .eq('stream_id', streamId)
        .eq('viewer_id', actorId);

      if (error) {
        console.error('Viewer pasiflenemedi:', error);
      }
    }

    async function refreshViewerCount() {
      if (!streamId) return;

      const cutoffIso = new Date(Date.now() - VIEWER_ACTIVE_WINDOW_MS).toISOString();

      const { data, error } = await supabase
        .from('stream_viewers')
        .select('viewer_id')
        .eq('stream_id', streamId)
        .eq('is_active', true)
        .gte('last_seen', cutoffIso);

      if (error) {
        console.error('Viewer count alınamadı:', error);
        return;
      }

      const count = Array.isArray(data) ? data.length : 0;
      updateViewerChip(count);

      if (currentStream) {
        currentStream.viewer_count = count;
      }

      const { error: streamUpdateError } = await supabase
        .from('streams')
        .update({ viewer_count: count })
        .eq('id', streamId);

      if (streamUpdateError) {
        console.error('streams.viewer_count güncellenemedi:', streamUpdateError);
      }
    }

    function startViewerPresence() {
      if (viewerHeartbeatTimer) return;

      upsertViewerPresence();
      refreshViewerCount();

      viewerHeartbeatTimer = setInterval(async () => {
        await upsertViewerPresence();
      }, VIEWER_HEARTBEAT_MS);

      viewerCountTimer = setInterval(async () => {
        await refreshViewerCount();
      }, VIEWER_COUNT_POLL_MS);
    }

    async function stopViewerPresence() {
      if (viewerHeartbeatTimer) {
        clearInterval(viewerHeartbeatTimer);
        viewerHeartbeatTimer = null;
      }
      if (viewerCountTimer) {
        clearInterval(viewerCountTimer);
        viewerCountTimer = null;
      }
      await markViewerInactive();
      await refreshViewerCount();
    }

    function configureScreenShareUI() {
      const supported = hasScreenShareSupport();
      const mobile = isMobileDevice();

      if (supported && !mobile) {
        shareScreenBtn.disabled = false;
        shareScreenBtn.classList.remove('btn-disabled');
        screenSupportNoteEl.style.display = 'none';
        return;
      }

      shareScreenBtn.disabled = true;
      shareScreenBtn.classList.add('btn-disabled');
      screenSupportNoteEl.style.display = 'block';

      if (!supported) {
        screenSupportNoteEl.textContent = 'Ekran paylaşımı bu cihaz veya tarayıcıda desteklenmiyor.';
      } else if (mobile) {
        screenSupportNoteEl.textContent = 'Ekran paylaşımı genelde masaüstü tarayıcılarda daha stabil çalışır. Telefonda kısıtlı olabilir.';
      }

      }

      const { data: stream, error } = await supabase
        .from('streams')

      if (error || !stream) {
        console.error(error);

      `;

    async function loadFollowState() {
      currentUser = await getCurrentUser();
      await ensureActorId();

      if (!currentStream) {
        followBtn.textContent = 'Takip et';
        return;
      }

      isBroadcaster = !!currentUser && currentUser.id === currentStream.streamer_id;

      if (isBroadcaster) {
        followBtn.textContent = 'Kendi yayının';
        followBtn.disabled = true;
        broadcasterPanelEl.classList.add('show');
        configureScreenShareUI();
        syncControlsFromState();

        if (!autoStartTried) {
          autoStartTried = true;
          setTimeout(() => startCamera(true), 350);
        }
        return;
      }

      if (!currentUser) {
        followBtn.textContent = 'Takip et';
        return;
      }

      const { data } = await supabase
        .from('follows')
        .select('id')
        .eq('follower_id', currentUser.id)
        .eq('following_id', currentStream.streamer_id)
        .maybeSingle();

      isFollowing = !!data;
      followBtn.textContent = isFollowing ? 'Takibi bırak' : 'Takip et';
    }

    async function toggleFollow() {
      currentUser = await getCurrentUser();

      if (!currentUser) {
        pageStatusEl.textContent = 'Takip etmek için giriş yapmalısın.';
        return;
      }

      if (!currentStream || currentUser.id === currentStream.streamer_id) return;

      if (isFollowing) {
        const { error } = await supabase
          .from('follows')
          .delete()
          .eq('follower_id', currentUser.id)
          .eq('following_id', currentStream.streamer_id);

        if (error) {
          pageStatusEl.textContent = 'Takipten çıkılamadı.';
          return;
        }

        isFollowing = false;
        followBtn.textContent = 'Takip et';
        pageStatusEl.textContent = 'Takip bırakıldı.';
      } else {
        const { error } = await supabase

          .insert({
            follower_id: currentUser.id,
            following_id: currentStream.streamer_id
          });

        if (error) {
          pageStatusEl.textContent = 'Takip edilemedi.';
          return;
        }

        isFollowing = true;
        followBtn.textContent = 'Takibi bırak';
        pageStatusEl.textContent = 'Yayıncı takip edildi.';
      }

    async function sendMessage(e) {

      currentUser = await getCurrentUser();

        pageStatusEl.textContent = 'Mesaj göndermek için giriş yapmalısın.';
        return;

        .from('profiles')
        .select('username, avatar_url')

        .maybeSingle();

        .from('stream_messages')
        .insert({
          stream_id: streamId,
          user_id: currentUser.id,

    function syncControlsFromState() {
      sceneModeEl.value = sceneState.mode;
      pipPositionEl.value = sceneState.pipPosition;
      pipSizeEl.value = String(sceneState.pipSizePercent);
      cameraShapeEl.value = sceneState.cameraShape;
      backgroundModeEl.value = sceneState.backgroundMode;
      toggleMicBtn.textContent = `Mikrofon: ${sceneState.micEnabled ? 'Açık' : 'Kapalı'}`;
      toggleScreenAudioBtn.textContent = `Ekran Sesi: ${sceneState.screenAudioEnabled ? 'Açık' : 'Kapalı'}`;
      toggleMicBtn.classList.toggle('btn-active', sceneState.micEnabled);
      toggleScreenAudioBtn.classList.toggle('btn-active', sceneState.screenAudioEnabled);
    }

    function updateStateFromControls() {
      sceneState.mode = sceneModeEl.value;
      sceneState.pipPosition = pipPositionEl.value;
      sceneState.pipSizePercent = Number(pipSizeEl.value || 24);
      sceneState.cameraShape = cameraShapeEl.value;
      sceneState.backgroundMode = backgroundModeEl.value;
    }

    async function loadBackgroundImage(src) {
      if (!src) return null;
      if (backgroundImageCache.has(src)) return backgroundImageCache.get(src);

      const img = new Image();
      img.crossOrigin = 'anonymous';

      const promise = new Promise((resolve) => {
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
      });

      img.src = src;
      const loaded = await promise;
      backgroundImageCache.set(src, loaded);
      return loaded;
    }

    function getSelectedBackgroundSource() {
      if (sceneState.backgroundMode === 'custom_image') return customBackgroundUrl || '';
      if (sceneState.backgroundMode in presetBackgrounds) return presetBackgrounds[sceneState.backgroundMode];
      return '';
    }

    function drawRoundedRectPath(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    async function drawCameraLayer(x, y, w, h, asPip = false) {
      if (!rawCameraStream || !cameraSourceVideo.srcObject) return;

      const bgMode = sceneState.backgroundMode;

      if (!asPip) {
        if (bgMode === 'solid_dark') {
          sceneCtx.fillStyle = '#0b1120';
          sceneCtx.fillRect(0, 0, sceneCanvas.width, sceneCanvas.height);
        } else if (bgMode === 'solid_blue') {
          sceneCtx.fillStyle = '#0f2747';
          sceneCtx.fillRect(0, 0, sceneCanvas.width, sceneCanvas.height);
        } else {
          const bgSrc = getSelectedBackgroundSource();
          if (bgSrc) {
            const bgImg = await loadBackgroundImage(bgSrc);
            if (bgImg) {
              sceneCtx.drawImage(bgImg, 0, 0, sceneCanvas.width, sceneCanvas.height);
            } else {
              sceneCtx.fillStyle = '#111827';
              sceneCtx.fillRect(0, 0, sceneCanvas.width, sceneCanvas.height);
            }
          } else {
            sceneCtx.fillStyle = '#0f172a';
            sceneCtx.fillRect(0, 0, sceneCanvas.width, sceneCanvas.height);
          }
        }
      }

      sceneCtx.save();

      if (sceneState.cameraShape === 'circle' && asPip) {
        sceneCtx.beginPath();
        sceneCtx.arc(x + w / 2, y + h / 2, Math.min(w, h) / 2, 0, Math.PI * 2);
        sceneCtx.closePath();
        sceneCtx.clip();
      } else if (sceneState.cameraShape === 'rounded') {
        drawRoundedRectPath(sceneCtx, x, y, w, h, 26);
        sceneCtx.clip();
      } else {
        sceneCtx.beginPath();
        sceneCtx.rect(x, y, w, h);
        sceneCtx.clip();
      }

      sceneCtx.drawImage(cameraSourceVideo, x, y, w, h);
      sceneCtx.restore();

      if (asPip) {
        sceneCtx.save();
        sceneCtx.lineWidth = 6;
        sceneCtx.strokeStyle = 'rgba(255,255,255,.75)';
        if (sceneState.cameraShape === 'circle') {
          sceneCtx.beginPath();
          sceneCtx.arc(x + w / 2, y + h / 2, Math.min(w, h) / 2, 0, Math.PI * 2);
          sceneCtx.stroke();
        } else if (sceneState.cameraShape === 'rounded') {
          drawRoundedRectPath(sceneCtx, x, y, w, h, 26);
          sceneCtx.stroke();
        } else {
          sceneCtx.strokeRect(x, y, w, h);
        }
        sceneCtx.restore();
      }
    }

    async function drawScene() {
      if (!isBroadcaster) return;

      const W = sceneCanvas.width;
      const H = sceneCanvas.height;

      sceneCtx.clearRect(0, 0, W, H);
      sceneCtx.fillStyle = '#0b1120';
      sceneCtx.fillRect(0, 0, W, H);

      const hasCamera = !!rawCameraStream && !!cameraSourceVideo.srcObject;
      const hasScreen = !!rawScreenStream && !!screenSourceVideo.srcObject;

      if (sceneState.mode === 'screen_only') {
        if (hasScreen) {
          sceneCtx.drawImage(screenSourceVideo, 0, 0, W, H);
        } else if (hasCamera) {
          await drawCameraLayer(0, 0, W, H, false);
        }
      }

      if (sceneState.mode === 'camera_only') {
        if (hasCamera) {
          await drawCameraLayer(0, 0, W, H, false);
        } else {
          sceneCtx.fillStyle = '#111827';
          sceneCtx.fillRect(0, 0, W, H);
        }
      }

      if (sceneState.mode === 'screen_camera') {
        if (hasScreen) {
          sceneCtx.drawImage(screenSourceVideo, 0, 0, W, H);
        } else {
          sceneCtx.fillStyle = '#111827';
          sceneCtx.fillRect(0, 0, W, H);
        }

        if (hasCamera) {
          const size = Math.round((sceneState.pipSizePercent / 100) * W);
          const pipW = size;
          const pipH = Math.round(size * 16 / 9);
          const margin = 24;

          let x = W - pipW - margin;
          let y = H - pipH - margin;

          if (sceneState.pipPosition === 'top-left') {
            x = margin; y = margin;
          }
          if (sceneState.pipPosition === 'top-right') {
            x = W - pipW - margin; y = margin;
          }
          if (sceneState.pipPosition === 'bottom-left') {
            x = margin; y = H - pipH - margin;
          }
          if (sceneState.pipPosition === 'bottom-right') {
            x = W - pipW - margin; y = H - pipH - margin;
          }

          await drawCameraLayer(x, y, pipW, pipH, true);
        }
      }

      drawLoopHandle = requestAnimationFrame(drawScene);
    }

    function startDrawLoop() {
      if (drawLoopHandle) cancelAnimationFrame(drawLoopHandle);
      drawLoopHandle = requestAnimationFrame(drawScene);
    }

    function stopDrawLoop() {
      if (drawLoopHandle) {
        cancelAnimationFrame(drawLoopHandle);
        drawLoopHandle = null;
      }
    }

    async function ensureAudioMix() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (!audioDestination) {
        audioDestination = audioContext.createMediaStreamDestination();
      }

      if (audioContext.state === 'suspended') {
        try { await audioContext.resume(); } catch (_) {}
      }

      if (micSourceNode) { try { micSourceNode.disconnect(); } catch (_) {} }
      if (screenSourceNode) { try { screenSourceNode.disconnect(); } catch (_) {} }
      if (micGainNode) { try { micGainNode.disconnect(); } catch (_) {} }
      if (screenGainNode) { try { screenGainNode.disconnect(); } catch (_) {} }

      micSourceNode = null;
      screenSourceNode = null;
      micGainNode = null;
      screenGainNode = null;

      if (rawCameraStream && rawCameraStream.getAudioTracks().length) {
        micSourceNode = audioContext.createMediaStreamSource(new MediaStream([rawCameraStream.getAudioTracks()[0]]));
        micGainNode = audioContext.createGain();
        micGainNode.gain.value = sceneState.micEnabled ? 1 : 0;
        micSourceNode.connect(micGainNode).connect(audioDestination);
      }

      if (rawScreenStream && rawScreenStream.getAudioTracks().length) {
        screenSourceNode = audioContext.createMediaStreamSource(new MediaStream([rawScreenStream.getAudioTracks()[0]]));
        screenGainNode = audioContext.createGain();
        screenGainNode.gain.value = sceneState.screenAudioEnabled ? 1 : 0;
        screenSourceNode.connect(screenGainNode).connect(audioDestination);
      }
    }

    async function rebuildOutboundStream() {
      if (!isBroadcaster) return;

      await ensureAudioMix();

      if (canvasCaptureStream) {
        canvasCaptureStream.getTracks().forEach(track => track.stop());
      }

      canvasCaptureStream = sceneCanvas.captureStream(30);
      const videoTrack = canvasCaptureStream.getVideoTracks()[0];
      const mixedAudioTracks = audioDestination ? audioDestination.stream.getAudioTracks() : [];

      outboundStream = new MediaStream([
        ...(videoTrack ? [videoTrack] : []),
        ...mixedAudioTracks
      ]);

      showOutboundPreview();
      await replacePeerTracks();
    }

    async function clearAllSignalsForThisStream() {
      if (!currentUser || !isBroadcaster) {
        processedSignalIds.clear();
        return;
      }

      const { error } = await supabase
        .from('stream_signals')
        .delete()
        .eq('stream_id', streamId);

      if (error) {
        console.error('Signal temizleme hatası:', error);
      }

      processedSignalIds.clear();
    }

    function createPeerConnection() {
      if (pc) return pc;

      pc = new RTCPeerConnection({
        iceServers: ICE_SERVERS,
        iceTransportPolicy: 'all'
      });

      pc.ontrack = (event) => {
        const inbound = event.streams?.[0];
        if (!inbound) return;
        remoteStream = inbound;
        showRemotePreview();
        pageStatusEl.textContent = 'Canlı yayın bağlantısı kuruldu.';
      };

      pc.onicecandidate = async (event) => {
        if (!event.candidate) return;
        await ensureActorId();

        const { error } = await supabase.from('stream_signals').insert({
          stream_id: streamId,
          sender_id: actorId,
          target_id: isBroadcaster ? null : currentStream.streamer_id,
          type: 'candidate',
          payload: event.candidate.toJSON()
        });

        if (error) {
          console.error('Candidate yazılamadı:', error);
        }
      };

      pc.onconnectionstatechange = () => {
        const state = pc?.connectionState || '';
        if (state === 'connected') {
          pageStatusEl.textContent = 'Bağlantı kuruldu.';
        } else if (state === 'connecting') {
          pageStatusEl.textContent = 'Bağlantı kuruluyor...';
        } else if (state === 'failed') {
          pageStatusEl.textContent = 'Bağlantı başarısız.';
        } else if (state === 'disconnected') {
          pageStatusEl.textContent = 'Bağlantı kesildi.';
        }
      };

      pc.oniceconnectionstatechange = () => {
        const state = pc?.iceConnectionState || '';
        if (state === 'failed') {
          pageStatusEl.textContent = 'ICE bağlantısı başarısız.';
        }
      };

      return pc;
    }

    async function resetPeer() {
      if (pc) {
        try { pc.close(); } catch (_) {}
        pc = null;
      }
      remoteStream = null;
    }

    async function stopRawStreams() {
      if (rawCameraStream) {
        rawCameraStream.getTracks().forEach(track => track.stop());
        rawCameraStream = null;
      }
      if (rawScreenStream) {
        rawScreenStream.getTracks().forEach(track => track.stop());
        rawScreenStream = null;
      }
      cameraSourceVideo.srcObject = null;
      screenSourceVideo.srcObject = null;
    }

    async function replacePeerTracks() {
      if (!pc || !outboundStream) return;

      const senders = pc.getSenders();
      const videoTrack = outboundStream.getVideoTracks()[0] || null;
      const audioTrack = outboundStream.getAudioTracks()[0] || null;

      const videoSender = senders.find(sender => sender.track && sender.track.kind === 'video');
      const audioSender = senders.find(sender => sender.track && sender.track.kind === 'audio');

      if (videoSender) {
        await videoSender.replaceTrack(videoTrack);
      } else if (videoTrack) {
        pc.addTrack(videoTrack, outboundStream);
      }

      if (audioSender) {
        await audioSender.replaceTrack(audioTrack);
      } else if (audioTrack) {
        pc.addTrack(audioTrack, outboundStream);
      }
    }

    async function publishOffer() {
      const peer = createPeerConnection();
      await replacePeerTracks();
      await ensureActorId();

      const offer = await peer.createOffer();
      await peer.setLocalDescription(offer);

      await supabase.from('stream_signals').insert({
        stream_id: streamId,
        sender_id: actorId,
        target_id: null,
        type: 'offer',
        payload: offer
      });
    }

    async function handleSignal(signal) {
      if (!signal || processedSignalIds.has(signal.id)) return;
      processedSignalIds.add(signal.id);

      await ensureActorId();

      if (signal.sender_id === actorId) return;

      try {
        if (signal.type === 'offer') {
          if (isBroadcaster) return;

          await resetPeer();
          createPeerConnection();

          await pc.setRemoteDescription(new RTCSessionDescription(signal.payload));

          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          await ensureActorId();

          const { error: answerError } = await supabase.from('stream_signals').insert({
            stream_id: streamId,
            sender_id: actorId,
            target_id: signal.sender_id,
            type: 'answer',
            payload: answer
          });

          if (answerError) {
            console.error('Answer yazılamadı:', answerError);
            pageStatusEl.textContent = 'Yanıt gönderilemedi.';
            return;
          }

          pageStatusEl.textContent = 'Yayın sinyali alındı, bağlantı kuruluyor...';
          return;
        }

        if (signal.type === 'answer') {
          if (!isBroadcaster) return;
          if (signal.target_id && signal.target_id !== actorId) return;
          if (!pc) return;
          if (pc.currentRemoteDescription) return;

          await pc.setRemoteDescription(new RTCSessionDescription(signal.payload));
          pageStatusEl.textContent = 'İzleyici bağlandı.';
          return;
        }

        if (signal.type === 'candidate') {
          if (!pc) return;

          if (isBroadcaster) {
            if (signal.target_id && signal.target_id !== actorId) return;
          } else {
            if (signal.target_id && signal.target_id !== actorId && signal.sender_id !== currentStream.streamer_id) return;
          }

          try {
            await pc.addIceCandidate(new RTCIceCandidate(signal.payload));
          } catch (_) {}
        }
      } catch (err) {
        console.error('Signal işleme hatası:', err);
      }
    }

    async function pollSignals() {
      const { data, error } = await supabase
        .from('stream_signals')
        .select('*')
        .eq('stream_id', streamId)
        .order('created_at', { ascending: true });

      if (error || !data) return;

      for (const signal of data) {
        await handleSignal(signal);
      }
    }

    function startSignalPolling() {
      if (signalPollTimer) return;
      pollSignals();
      signalPollTimer = setInterval(async () => {
        await pollSignals();
      }, 1000);
    }

    async function startCamera(silent = false) {
      try {
        if (!isBroadcaster) {
          if (!silent) pageStatusEl.textContent = 'Bu panel sadece yayıncıya açık.';
          return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          pageStatusEl.textContent = 'Bu tarayıcı kamera erişimini desteklemiyor.';
          return;
        }

        if (rawCameraStream) {
          rawCameraStream.getTracks().forEach(track => track.stop());
        }

        rawCameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: true
        });

        cameraSourceVideo.srcObject = rawCameraStream;
        await cameraSourceVideo.play().catch(() => {});

        updateStateFromControls();
        syncControlsFromState();

        startDrawLoop();
        await rebuildOutboundStream();

        if (!pc) {
          await clearAllSignalsForThisStream();
          await publishOffer();
          startSignalPolling();
        } else {
          await clearAllSignalsForThisStream();
          await publishOffer();
        }

        pageStatusEl.textContent = 'Kamera açıldı. Sahne güncellendi.';
      } catch (error) {
        console.error(error);
        if (!silent) {
          pageStatusEl.textContent = 'Kamera açılamadı. Tarayıcı izinlerini kontrol et.';
        }
      }
    }

    async function shareScreen() {
      try {
        if (!isBroadcaster) {
          pageStatusEl.textContent = 'Bu panel sadece yayıncıya açık.';
          return;
        }

        if (!hasScreenShareSupport() || isMobileDevice()) {
          pageStatusEl.textContent = 'Ekran paylaşımı bu cihazda kullanılamıyor. Bunu masaüstünde dene.';
          return;
        }

        if (rawScreenStream) {
          rawScreenStream.getTracks().forEach(track => track.stop());
        }

        rawScreenStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

        screenSourceVideo.srcObject = rawScreenStream;
        await screenSourceVideo.play().catch(() => {});

        updateStateFromControls();
        syncControlsFromState();

        startDrawLoop();
        await rebuildOutboundStream();

        if (!pc) {
          await clearAllSignalsForThisStream();
          await publishOffer();
          startSignalPolling();
        } else {
          await clearAllSignalsForThisStream();
          await publishOffer();
        }

        pageStatusEl.textContent = 'Ekran paylaşımı açıldı. Sahne güncellendi.';

        const videoTrack = rawScreenStream.getVideoTracks()[0];
        if (videoTrack) {
          videoTrack.onended = async () => {
            if (rawScreenStream) {
              rawScreenStream.getTracks().forEach(track => track.stop());
              rawScreenStream = null;
              screenSourceVideo.srcObject = null;
            }
            await rebuildOutboundStream();
            if (pc) {
              await clearAllSignalsForThisStream();
              await publishOffer();
            }
            pageStatusEl.textContent = 'Ekran paylaşımı sona erdi.';
          };
        }
      } catch (error) {
        console.error(error);
        pageStatusEl.textContent = 'Ekran paylaşımı başlatılamadı.';
      }
    }

    async function applySceneSettings() {
      updateStateFromControls();
      syncControlsFromState();

      if (!isBroadcaster) return;
      if (!rawCameraStream && !rawScreenStream) {
        pageStatusEl.textContent = 'Önce kamera veya ekran paylaşımı başlat.';
        return;
      }

      startDrawLoop();
      await rebuildOutboundStream();

      if (pc) {
        await clearAllSignalsForThisStream();
        await publishOffer();
      }

      pageStatusEl.textContent = 'Sahne ayarları uygulandı.';
    }

    async function toggleMic() {
      sceneState.micEnabled = !sceneState.micEnabled;
      syncControlsFromState();

      await rebuildOutboundStream();
      if (pc) {
        await clearAllSignalsForThisStream();
        await publishOffer();
      }

      pageStatusEl.textContent = sceneState.micEnabled ? 'Mikrofon açıldı.' : 'Mikrofon kapatıldı.';
    }

    async function toggleScreenAudio() {
      sceneState.screenAudioEnabled = !sceneState.screenAudioEnabled;
      syncControlsFromState();

      await rebuildOutboundStream();
      if (pc) {
        await clearAllSignalsForThisStream();
        await publishOffer();
      }

      pageStatusEl.textContent = sceneState.screenAudioEnabled ? 'Ekran sesi açıldı.' : 'Ekran sesi kapatıldı.';
    }

    async function stopPreviewOnly() {
      if (signalPollTimer) {
        clearInterval(signalPollTimer);
        signalPollTimer = null;
      }

      stopDrawLoop();
      await stopRawStreams();
      await resetPeer();

      if (canvasCaptureStream) {
        canvasCaptureStream.getTracks().forEach(track => track.stop());
        canvasCaptureStream = null;
      }

      outboundStream = null;

      if (isBroadcaster) {
        await clearAllSignalsForThisStream();
      }

      if (currentStream) {
        renderImagePlayer(currentStream, currentProfile);
      }

      pageStatusEl.textContent = 'Önizleme durduruldu.';
    }

    async function stopLiveStream() {
      try {
        if (!isBroadcaster || !currentStream) return;

        await stopPreviewOnly();
        await stopViewerPresence();

        const { error } = await supabase
          .from('streams')
          .update({ is_live: false, viewer_count: 0 })
          .eq('id', currentStream.id);

        if (error) {
          console.error(error);
          pageStatusEl.textContent = 'Yayın veritabanında kapatılamadı.';
          return;
        }

        pageStatusEl.textContent = 'Yayın kapatıldı. Ana sayfaya yönlendiriliyorsun...';
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 1200);
      } catch (error) {
        console.error(error);
        pageStatusEl.textContent = 'Yayın durdurulurken hata oluştu.';
      }
    }

    uploadBackgroundBtn.addEventListener('click', () => {
      backgroundFileInput.click();
    });

    backgroundFileInput.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      customBackgroundUrl = URL.createObjectURL(file);
      backgroundModeEl.value = 'custom_image';
      sceneState.backgroundMode = 'custom_image';

      if (isBroadcaster && (rawCameraStream || rawScreenStream)) {
        await applySceneSettings();
      }
    });

    followBtn.addEventListener('click', toggleFollow);
    chatFormEl.addEventListener('submit', sendMessage);
    startCameraBtn.addEventListener('click', () => startCamera(false));
    shareScreenBtn.addEventListener('click', shareScreen);
    toggleMicBtn.addEventListener('click', toggleMic);
    toggleScreenAudioBtn.addEventListener('click', toggleScreenAudio);
    applySceneBtn.addEventListener('click', applySceneSettings);
    stopPreviewBtn.addEventListener('click', stopPreviewOnly);
    stopStreamBtn.addEventListener('click', stopLiveStream);

    window.addEventListener('beforeunload', () => {
      if (!actorId || !streamId) return;
      navigator.sendBeacon?.(
        'data:text/plain,viewer-leaving',
        ''
      );
    });

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'hidden') {
        await markViewerInactive();
      } else {
        await upsertViewerPresence();
        await refreshViewerCount();
      }
    });

    await loadStream();
    await loadFollowState();
    await loadMessages();
    await ensureActorId();
    startSignalPolling();
    startViewerPresence();

    if (!isBroadcaster) {
      pageStatusEl.textContent = currentUser
        ? 'Yayın bağlantısı bekleniyor...'
        : 'Misafir izleyici olarak bağlanılıyor...';
    }

    setInterval(async () => {
      await loadMessages();
    }, 4000);
  </script>
</body>
</html>
