<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Celivo - Yayın</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background: #020617;
    }

    .player {
      width: 100%;
      height: 400px;
      background: black;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls {
      padding: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .primary { background: #3b82f6; color: white; }
    .danger { background: #ef4444; color: white; }
    .secondary { background: #1e293b; color: white; }

    .chat {
      padding: 20px;
    }

    input {
      padding: 10px;
      width: 70%;
    }
  </style>
</head>

<body>

<div class="player" id="player">
  <video id="video" autoplay muted playsinline></video>
</div>

<div class="controls">
  <button id="startCamera" class="primary">Kamerayı Aç</button>
  <button id="screenShare" class="primary">Ekran Paylaş</button>
  <button id="muteMic" class="secondary">Mikrofon Kapat</button>
  <button id="stopStream" class="danger">Yayını Durdur</button>
</div>

<div class="chat">
  <input id="chatInput" placeholder="Mesaj yaz..." />
  <button onclick="sendMessage()">Gönder</button>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
  'https://nxxnhqtqvrkbdhltoijz.supabase.co',
  'sb_publishable_YKoXoU5eJNyO7bYBKWh73g_0RDK7bF0'
);

const video = document.getElementById("video");

let localStream = null;
let isMicMuted = false;
let autoStartTried = false;
let isBroadcaster = false;
let currentUser = null;
let streamId = new URLSearchParams(window.location.search).get("id");

async function getUser() {
  const { data } = await supabase.auth.getSession();
  return data?.session?.user || null;
}

async function checkBroadcaster() {
  currentUser = await getUser();

  const { data: stream } = await supabase
    .from("streams")
    .select("*")
    .eq("id", streamId)
    .single();

  if (!stream) return;

  if (currentUser && currentUser.id === stream.streamer_id) {
    isBroadcaster = true;

    // 🔥 OTOMATİK KAMERA BAŞLATMA
    if (!autoStartTried) {
      autoStartTried = true;
      setTimeout(() => startCamera(true), 500);
    }
  }
}

function stopTracks() {
  if (!localStream) return;
  localStream.getTracks().forEach(t => t.stop());
}

async function startCamera(silent = false) {
  try {
    if (!isBroadcaster) return;

    stopTracks();

    localStream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    video.srcObject = localStream;
    await video.play();

    isMicMuted = false;
  } catch (e) {
    console.log(e);
    if (!silent) alert("Kamera açılmadı");
  }
}

async function shareScreen() {
  try {
    stopTracks();

    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: true
    });

    video.srcObject = localStream;
    await video.play();
  } catch (e) {
    alert("Ekran paylaşımı başarısız");
  }
}

function toggleMic() {
  if (!localStream) return;

  isMicMuted = !isMicMuted;

  localStream.getAudioTracks().forEach(track => {
    track.enabled = !isMicMuted;
  });
}

async function stopStream() {
  stopTracks();

  await supabase
    .from("streams")
    .update({ is_live: false })
    .eq("id", streamId);

  window.location.href = "/";
}

function sendMessage() {
  alert("Chat hazır ama backend zaten çalışıyor 👍");
}

document.getElementById("startCamera").onclick = () => startCamera();
document.getElementById("screenShare").onclick = shareScreen;
document.getElementById("muteMic").onclick = toggleMic;
document.getElementById("stopStream").onclick = stopStream;

checkBroadcaster();

</script>

</body>
</html>
